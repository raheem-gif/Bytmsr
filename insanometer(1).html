<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>INSANOMETER · PERSONAL PROTOCOL</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSANOMETER">
<meta name="theme-color" content="#0a001a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231a0033'/%3E%3Ccircle cx='90' cy='70' r='42' fill='%23ff10a8'/%3E%3Crect x='48' y='86' width='84' height='4' fill='%231a0033'/%3E%3Crect x='48' y='96' width='84' height='5' fill='%231a0033'/%3E%3Crect x='48' y='108' width='84' height='7' fill='%231a0033'/%3E%3Cg stroke='%2300f0ff' stroke-width='1.5'%3E%3Cline x1='90' y1='130' x2='20' y2='180'/%3E%3Cline x1='90' y1='130' x2='60' y2='180'/%3E%3Cline x1='90' y1='130' x2='90' y2='180'/%3E%3Cline x1='90' y1='130' x2='120' y2='180'/%3E%3Cline x1='90' y1='130' x2='160' y2='180'/%3E%3Cline x1='10' y1='150' x2='170' y2='150'/%3E%3Cline x1='0' y1='165' x2='180' y2='165'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a0033'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%23ff10a8'/%3E%3C/svg%3E">

<style>
:root {
  --bg-0: #0a001a;
  --bg-1: #14082b;
  --bg-2: #1f0e3d;
  --ink: #f5e9ff;
  --ink-dim: #b39ad8;
  --ink-faint: #6a5b8a;
  --pink: #ff10a8;
  --pink-glow: #ff5ac4;
  --cyan: #00f0ff;
  --cyan-glow: #5cf5ff;
  --magenta: #ff10f0;
  --amber: #ffb627;
  --green: #39ff14;
  --red: #ff3b6e;
  --purple: #9d4edd;
  --void: #ff003c;
  --font-display: 'VT323', monospace;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
}
body.light-theme {
  --bg-0: #f5ecd9;
  --bg-1: #efe2c4;
  --bg-2: #e8d5a8;
  --ink: #1a0a2e;
  --ink-dim: #4a2a5e;
  --ink-faint: #8a6a8a;
  --pink: #c81d77;
  --pink-glow: #a91560;
  --cyan: #0d7a8a;
  --cyan-glow: #0a5a68;
  --magenta: #b8108c;
  --amber: #c4781a;
  --green: #2d7a14;
  --red: #b8253e;
  --purple: #6a2eb0;
  --void: #8a0028;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); color: var(--ink); font-family: var(--font-mono); overflow-x: hidden; }
body { min-height: 100vh; position: relative; }
a { color: inherit; }
button { font-family: inherit; }

/* ===== HERO (fixed, blurs on scroll) ===== */
#hero {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden;
  transition: filter 0.4s ease-out, opacity 0.4s;
  background: #1a0033;
}
#sky-bands { position: absolute; inset: 0; }
#stars-layer { position: absolute; left: 0; right: 0; top: 0; height: 55%; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
.star.big { width: 3px; height: 3px; }
@keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
#sun {
  position: absolute; left: 50%; top: 18vh;
  transform: translateX(-50%);
  width: clamp(220px, 28vw, 360px); aspect-ratio: 1;
  transition: transform 0.2s ease-out;
}
#mountains-layer {
  position: absolute; left: 0; width: 100%;
  bottom: 50vh; height: 12vh;
}
#horizon-glow {
  position: absolute; left: 0; right: 0; bottom: 50vh; height: 2px;
  background: var(--pink-glow);
  box-shadow: 0 0 12px var(--pink), 0 0 30px var(--pink), 0 0 60px var(--magenta);
}
#grid-canvas {
  position: absolute; left: 0; bottom: 0; width: 100%; height: 50vh;
  background: var(--bg-0);
}
#scanlines {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
#hero-title {
  position: absolute; left: 50%; top: 38vh;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 5;
}
#hero-title h1 {
  font-family: var(--font-display);
  font-size: clamp(56px, 10vw, 140px);
  letter-spacing: 0.08em;
  color: white;
  text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink), 0 0 50px var(--magenta), 2px 0 0 var(--cyan), -2px 0 0 var(--pink);
  line-height: 0.9;
  animation: chromatic 4s ease-in-out infinite;
}
@keyframes chromatic {
  0%, 100% { text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink), 0 0 50px var(--magenta), 2px 0 0 var(--cyan), -2px 0 0 var(--pink); }
  50% { text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink), 0 0 50px var(--magenta), -2px 0 0 var(--cyan), 2px 0 0 var(--pink); }
}
#hero-sub {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.2vw, 14px);
  letter-spacing: 0.4em;
  color: var(--cyan);
  text-shadow: 0 0 6px var(--cyan);
  margin-top: 14px;
  text-transform: uppercase;
}
#scroll-hint {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.5em;
  color: var(--pink-glow); text-shadow: 0 0 8px var(--pink);
  animation: blink 1.4s steps(2) infinite;
  z-index: 10;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

/* ===== APP CONTAINER (scrolls over hero) ===== */
#app {
  position: relative; z-index: 10;
  margin-top: 100vh;
  min-height: 100vh;
  background: linear-gradient(180deg, rgba(10,0,26,0) 0%, rgba(10,0,26,0.92) 100px, rgba(10,0,26,0.96) 100%);
  padding: 40px 24px 120px;
}
#app-header {
  max-width: 1280px; margin: 0 auto 48px;
  display: flex; justify-content: space-between; align-items: flex-end;
  flex-wrap: wrap; gap: 24px;
}
#app-header .brand {
  font-family: var(--font-display);
  font-size: 48px; letter-spacing: 0.1em; color: white;
  text-shadow: 0 0 8px var(--pink), 0 0 22px var(--magenta);
  line-height: 1;
}
#app-header .meta {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--cyan); text-shadow: 0 0 4px var(--cyan);
  letter-spacing: 0.3em; text-transform: uppercase;
}
#date-display { color: var(--ink-dim); margin-top: 6px; font-size: 13px; letter-spacing: 0.15em; }

/* ===== INSANOMETER (floating) ===== */
#insanometer {
  position: fixed; top: 24px; right: 24px;
  z-index: 100;
  background: rgba(10, 0, 26, 0.88);
  border: 1px solid var(--pink);
  border-radius: 4px;
  padding: 14px 18px;
  font-family: var(--font-mono);
  min-width: 220px;
  box-shadow: 0 0 16px rgba(255, 16, 168, 0.5), 0 0 40px rgba(255, 16, 168, 0.2);
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
#insanometer.void {
  border-color: var(--void);
  box-shadow: 0 0 16px rgba(255, 0, 60, 0.6), 0 0 40px rgba(255, 0, 60, 0.3);
  animation: voidpulse 1.2s ease-in-out infinite;
}
@keyframes voidpulse {
  0%, 100% { box-shadow: 0 0 16px rgba(255, 0, 60, 0.6), 0 0 40px rgba(255, 0, 60, 0.3); }
  50% { box-shadow: 0 0 24px rgba(255, 0, 60, 0.9), 0 0 60px rgba(255, 0, 60, 0.5); }
}
#insanometer .label {
  font-size: 10px; letter-spacing: 0.35em; color: var(--pink-glow);
  text-shadow: 0 0 4px var(--pink);
}
#insanometer .value {
  font-family: var(--font-display);
  font-size: 56px; line-height: 0.9;
  color: white; text-shadow: 0 0 8px currentColor, 0 0 18px currentColor;
  margin: 4px 0 8px;
  transition: color 0.4s;
}
#insanometer.void .value { color: var(--void); }
#insanometer .bar {
  height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 2px; overflow: hidden;
}
#insanometer .bar-fill {
  height: 100%; background: var(--pink);
  box-shadow: 0 0 8px var(--pink);
  transition: width 0.6s cubic-bezier(.2,.7,.3,1), background 0.3s;
}
#insanometer.void .bar-fill { background: var(--void); box-shadow: 0 0 8px var(--void); }
#insanometer .breakdown {
  margin-top: 10px; font-size: 10px; color: var(--ink-faint);
  letter-spacing: 0.15em;
}

/* ===== QUOTE BANNER (when prayer missed) ===== */
#quote-banner {
  max-width: 1280px; margin: 0 auto 48px;
  border: 1px solid var(--void);
  background: rgba(255, 0, 60, 0.08);
  padding: 28px 32px;
  position: relative;
  display: none;
}
#quote-banner.visible { display: block; animation: slidein 0.5s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
#quote-banner::before {
  content: 'VOID DAY'; position: absolute; top: -10px; left: 24px;
  background: var(--bg-0); padding: 0 10px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--void); letter-spacing: 0.4em;
}
#quote-text {
  font-family: var(--font-serif); font-size: 28px; line-height: 1.35;
  color: var(--ink); font-style: italic;
}
#quote-meta { margin-top: 12px; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.2em; text-transform: uppercase; }

/* ===== GRID ===== */
#grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.tile {
  background: rgba(20, 8, 43, 0.6);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid var(--accent, var(--pink));
  border-radius: 4px;
  padding: 24px 22px 22px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(.2,.7,.3,1);
  min-height: 200px;
  display: flex; flex-direction: column;
  backdrop-filter: blur(2px);
}
.tile::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 0%, var(--accent, var(--pink)) 200%);
  opacity: 0.05; pointer-events: none;
}
.tile::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.02) 2px 3px);
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
.tile:hover {
  transform: translateY(-3px);
  border-color: var(--accent, var(--pink));
  box-shadow: 0 0 24px var(--accent-glow, rgba(255,16,168,0.4)), 0 8px 24px rgba(0,0,0,0.4);
}
.tile:hover::after { opacity: 1; }
.tile .tile-num {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--ink-faint); letter-spacing: 0.3em;
}
.tile .tile-icon {
  font-family: var(--font-display);
  font-size: 32px; color: var(--accent, var(--pink));
  text-shadow: 0 0 10px var(--accent, var(--pink));
  margin: 8px 0 2px;
}
.tile h2 {
  font-family: var(--font-display);
  font-size: 28px; line-height: 1; letter-spacing: 0.02em;
  color: white; margin: 4px 0 4px;
  text-shadow: 0 0 6px var(--accent, var(--pink));
}
.tile .tile-sub {
  font-size: 12px; color: var(--ink-dim);
  letter-spacing: 0.05em; margin-bottom: auto;
}
.tile .tile-status {
  margin-top: 16px; padding-top: 12px;
  border-top: 1px dashed rgba(255,255,255,0.1);
  font-size: 11px; letter-spacing: 0.15em;
  color: var(--accent, var(--pink));
  display: flex; justify-content: space-between; align-items: center;
}
.tile .tile-status .progress {
  flex: 1; margin-left: 10px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden;
}
.tile .tile-status .progress > span {
  display: block; height: 100%;
  background: var(--accent, var(--pink));
  box-shadow: 0 0 6px var(--accent, var(--pink));
  transition: width 0.5s;
}
.tile-add {
  border: 1px dashed rgba(255,255,255,0.15);
  border-left: 1px dashed rgba(255,255,255,0.15);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  font-family: var(--font-display); font-size: 24px;
  letter-spacing: 0.1em;
  cursor: pointer;
  min-height: 200px;
  transition: all 0.3s;
}
.tile-add:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan);
  background: rgba(0, 240, 255, 0.04);
}

/* per-tile accent colors */
.tile[data-id="day"]         { --accent: #ff5ac4; --accent-glow: rgba(255,90,196,0.5); }
.tile[data-id="wellness"]    { --accent: #39ff14; --accent-glow: rgba(57,255,20,0.4); }
.tile[data-id="deen"]        { --accent: #ffb627; --accent-glow: rgba(255,182,39,0.4); }
.tile[data-id="studying"]    { --accent: #00f0ff; --accent-glow: rgba(0,240,255,0.4); }
.tile[data-id="sqe"]         { --accent: #9d4edd; --accent-glow: rgba(157,78,221,0.4); }
.tile[data-id="nofap"]       { --accent: #ff3b6e; --accent-glow: rgba(255,59,110,0.4); }
.tile[data-id="work"]        { --accent: #ff10a8; --accent-glow: rgba(255,16,168,0.4); }
.tile[data-id="journal"]     { --accent: #9d4edd; --accent-glow: rgba(157,78,221,0.4); }
.tile[data-id="bella"]       { --accent: #ff8fc4; --accent-glow: rgba(255,143,196,0.4); }
.tile[data-id="mystery"]     { --accent: #c77dff; --accent-glow: rgba(199,125,255,0.4); }
.tile[data-id="financials"]  { --accent: #f0c419; --accent-glow: rgba(240,196,25,0.4); }
.tile[data-id="calendar"]    { --accent: #5cf5ff; --accent-glow: rgba(92,245,255,0.4); }

/* ===== DETAIL VIEW ===== */
#detail {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10, 0, 26, 0.97);
  backdrop-filter: blur(20px);
  overflow-y: auto;
  display: none;
}
#detail.open { display: block; animation: detailIn 0.35s cubic-bezier(.2,.7,.3,1); }
@keyframes detailIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
#detail-header {
  position: sticky; top: 0;
  background: rgba(10, 0, 26, 0.96);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 20px 32px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 10;
  backdrop-filter: blur(10px);
}
#detail-back {
  background: transparent; border: 1px solid var(--ink-faint);
  color: var(--ink-dim); padding: 8px 14px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.25em; cursor: pointer;
  transition: all 0.2s;
}
#detail-back:hover { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 8px var(--pink); }
#detail-title {
  font-family: var(--font-display); font-size: 36px;
  color: white; letter-spacing: 0.04em;
}
#detail-content {
  max-width: 980px; margin: 0 auto;
  padding: 40px 32px 80px;
}

/* ===== shared module styles ===== */
.section { margin-bottom: 36px; }
.section-title {
  font-family: var(--font-display); font-size: 22px;
  color: var(--accent, var(--cyan));
  letter-spacing: 0.06em;
  margin-bottom: 14px;
  text-shadow: 0 0 6px var(--accent, var(--cyan));
  text-transform: uppercase;
}
.section-sub {
  font-size: 12px; color: var(--ink-faint);
  letter-spacing: 0.15em; text-transform: uppercase;
  margin-bottom: 8px;
}
.card {
  background: rgba(20, 8, 43, 0.5);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 14px;
}
.card.accent { border-left: 3px solid var(--accent, var(--cyan)); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.field {
  display: block; width: 100%;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
  color: var(--ink); padding: 10px 14px;
  font-family: var(--font-mono); font-size: 14px;
  border-radius: 3px;
  outline: none; transition: all 0.2s;
}
.field:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,240,255,0.3); }
.btn {
  background: transparent; border: 1px solid var(--pink); color: var(--pink);
  padding: 9px 16px; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.3em; cursor: pointer;
  border-radius: 3px; transition: all 0.2s;
  text-transform: uppercase;
}
.btn:hover { background: var(--pink); color: var(--bg-0); box-shadow: 0 0 10px var(--pink); }
.btn.cyan { border-color: var(--cyan); color: var(--cyan); }
.btn.cyan:hover { background: var(--cyan); color: var(--bg-0); box-shadow: 0 0 10px var(--cyan); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red); color: var(--bg-0); }
.btn.ghost { border-color: var(--ink-faint); color: var(--ink-dim); }
.btn.ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(255,255,255,0.05); }
.check-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.06);
}
.check-row:first-child { border-top: none; }
.check-row input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 1px solid var(--ink-faint); background: transparent;
  cursor: pointer; position: relative;
  border-radius: 2px;
}
.check-row input[type=checkbox]:checked {
  background: var(--accent, var(--green));
  border-color: var(--accent, var(--green));
  box-shadow: 0 0 6px var(--accent, var(--green));
}
.check-row input[type=checkbox]:checked::after {
  content: '✓'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--bg-0); font-size: 12px; font-weight: 700;
}
.check-row label { flex: 1; cursor: pointer; font-size: 14px; }
.check-row.done label { text-decoration: line-through; color: var(--ink-faint); }
.del { color: var(--ink-faint); cursor: pointer; font-size: 16px; padding: 4px 8px; }
.del:hover { color: var(--red); }
.stat {
  display: flex; flex-direction: column; gap: 4px;
  padding: 16px 20px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 3px;
  flex: 1; min-width: 140px;
}
.stat-label { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.3em; text-transform: uppercase; }
.stat-value { font-family: var(--font-display); font-size: 36px; color: var(--accent, white); text-shadow: 0 0 6px currentColor; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--ink-dim); }

/* Prayer specific */
.prayer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.prayer {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 3px; padding: 14px;
  cursor: pointer; transition: all 0.25s;
  position: relative;
}
.prayer.done {
  border-color: var(--amber); background: rgba(255,182,39,0.08);
  box-shadow: 0 0 10px rgba(255,182,39,0.25);
}
.prayer.missed {
  border-color: var(--void); background: rgba(255,0,60,0.08);
  animation: voidshake 0.5s;
}
@keyframes voidshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.prayer-name { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.1em; }
.prayer-time { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.2em; margin-top: 2px; }
.prayer.done .prayer-name { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
.prayer.missed .prayer-name { color: var(--void); text-shadow: 0 0 6px var(--void); }
.prayer-check { position: absolute; top: 10px; right: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; }
.prayer.done .prayer-check { opacity: 1; color: var(--amber); }
.prayer.missed .prayer-check { opacity: 1; color: var(--void); }

/* exam blocks */
.exam-block {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.25);
  padding: 18px 20px;
  margin-bottom: 12px;
  border-radius: 3px;
  border-left: 3px solid var(--cyan);
}
.exam-block.past { opacity: 0.5; }
.exam-block.final { border-left-color: var(--amber); background: rgba(255,182,39,0.04); }
.exam-block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 12px; flex-wrap: wrap; }
.exam-name { font-family: var(--font-display); font-size: 22px; color: var(--cyan); letter-spacing: 0.04em; }
.exam-block.final .exam-name { color: var(--amber); }
.exam-date { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.2em; }
.exam-countdown { font-family: var(--font-display); font-size: 18px; color: white; }
.exam-countdown.urgent { color: var(--red); animation: blink 1s steps(2) infinite; }

/* primary "DAY" tile — full width hero card */
.tile.primary {
  grid-column: 1 / -1;
  min-height: 180px;
  border-left: 3px solid var(--pink);
  background: linear-gradient(135deg, rgba(255,16,168,0.08), rgba(0,240,255,0.04));
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
body.light-theme .tile.primary { background: linear-gradient(135deg, rgba(200,29,119,0.08), rgba(13,122,138,0.04)); }
.tile.primary::before { opacity: 0.08; }
.tile.primary .primary-left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile.primary .primary-date {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.4em; color: var(--cyan);
  text-shadow: 0 0 4px var(--cyan); text-transform: uppercase;
}
.tile.primary .primary-headline {
  font-family: var(--font-display); font-size: 38px; line-height: 1;
  color: white; letter-spacing: 0.04em;
  text-shadow: 0 0 8px var(--pink);
}
body.light-theme .tile.primary .primary-headline { color: var(--ink); }
.tile.primary .primary-missing {
  font-size: 13px; color: var(--ink-dim);
  display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px;
}
.tile.primary .primary-missing .miss-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; background: rgba(255,16,168,0.12);
  border: 1px solid rgba(255,16,168,0.35); border-radius: 3px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--pink-glow);
}
.tile.primary .primary-missing .miss-tag.ok { background: rgba(57,255,20,0.1); border-color: rgba(57,255,20,0.3); color: var(--green); }
.tile.primary .primary-right { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; min-width: 200px; }
.tile.primary .primary-clock {
  font-family: var(--font-display); font-size: 62px; line-height: 1;
  color: white; letter-spacing: 0.06em;
  text-shadow: 0 0 10px var(--cyan), 0 0 22px var(--cyan);
}
body.light-theme .tile.primary .primary-clock { color: var(--ink); }
.tile.primary .primary-cta {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.3em; color: var(--ink-dim);
  text-transform: uppercase;
}
.tile.primary:hover .primary-cta { color: var(--cyan); }
.tile.primary .primary-blocks-mini {
  display: flex; gap: 2px; height: 14px; width: 100%; margin-top: 8px;
  border-radius: 2px; overflow: hidden;
  background: rgba(255,255,255,0.04);
}
.tile.primary .primary-blocks-mini > span {
  flex: 1; min-width: 0;
  border-right: 1px solid rgba(0,0,0,0.3);
}

/* DAY detail view (timeline) */
.day-controls {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 14px 0; margin-bottom: 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
body.light-theme .day-controls { border-bottom-color: rgba(0,0,0,0.08); }
.armed-display {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.2em; color: var(--ink-dim);
  margin-right: auto;
}
.armed-display strong { color: var(--cyan); text-shadow: 0 0 4px var(--cyan); }
.armed-display.has-armed { color: var(--ink); }
.chip-strip {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px;
  margin: -4px 0 14px;
  scrollbar-width: thin;
}
.mod-chip {
  flex-shrink: 0;
  background: transparent; border: 1px solid currentColor;
  color: var(--chip-color, var(--pink));
  padding: 8px 14px; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.2em; cursor: pointer; border-radius: 3px;
  text-transform: uppercase; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.mod-chip:hover { background: var(--chip-color, var(--pink)); color: var(--bg-0); box-shadow: 0 0 10px var(--chip-color, var(--pink)); }
.mod-chip.armed {
  background: var(--chip-color, var(--pink)); color: var(--bg-0);
  box-shadow: 0 0 14px var(--chip-color, var(--pink));
  animation: chippulse 1.2s ease-in-out infinite;
}
@keyframes chippulse {
  0%, 100% { box-shadow: 0 0 14px var(--chip-color, var(--pink)); }
  50% { box-shadow: 0 0 22px var(--chip-color, var(--pink)); }
}
.timeline-wrap { position: relative; }
.timeline-hour {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 8px 0;
  transition: padding 0.25s, background 0.25s;
  position: relative;
  cursor: pointer;
}
body.light-theme .timeline-hour { border-top-color: rgba(0,0,0,0.08); }
.timeline-hour.zoomed-out { padding: 4px 0; min-height: 24px; }
.timeline-hour.zoomed-in { padding: 14px 0; min-height: 70px; }
.timeline-hour.now {
  background: rgba(255,16,168,0.04);
  border-left: 2px solid var(--pink);
}
.timeline-hour.now::before {
  content: 'NOW'; position: absolute; left: 64px; top: 4px;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.3em; color: var(--pink);
  text-shadow: 0 0 4px var(--pink);
}
.timeline-hour.armed-hover { background: rgba(0,240,255,0.06); }
.timeline-hour .th-label {
  font-family: var(--font-display); font-size: 18px;
  color: var(--ink-faint); letter-spacing: 0.05em;
  align-self: flex-start; padding-top: 2px;
}
.timeline-hour.now .th-label { color: var(--pink); text-shadow: 0 0 4px var(--pink); }
.timeline-hour.zoomed-out .th-label { font-size: 13px; }
.timeline-hour .th-blocks {
  display: flex; flex-wrap: wrap; gap: 6px;
  align-content: flex-start; min-height: 22px;
}
.timeline-hour.zoomed-out .th-blocks { gap: 3px; }
.tl-block {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: var(--block-color, rgba(255,16,168,0.15));
  border: 1px solid var(--block-stroke, var(--pink));
  border-radius: 3px;
  font-size: 12px; color: var(--ink); cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-mono); letter-spacing: 0.05em;
  max-width: 100%;
}
.tl-block:hover { transform: translateY(-1px); box-shadow: 0 0 10px var(--block-stroke, var(--pink)); }
.tl-block .tl-mod {
  font-family: var(--font-display); font-size: 13px;
  color: var(--block-stroke, var(--pink)); letter-spacing: 0.1em;
}
.tl-block .tl-text { color: var(--ink); }
.tl-block .tl-dur { font-size: 10px; color: var(--ink-faint); margin-left: 4px; }
.timeline-hour.zoomed-out .tl-block { padding: 2px 6px; font-size: 10px; }
.timeline-hour.zoomed-out .tl-block .tl-mod { font-size: 10px; }
.timeline-hour.zoomed-out .tl-block .tl-text,
.timeline-hour.zoomed-out .tl-block .tl-dur { display: none; }
.tl-empty-hint {
  font-size: 10px; color: var(--ink-faint); letter-spacing: 0.25em;
  text-transform: uppercase; opacity: 0; transition: opacity 0.2s;
}
.timeline-hour:hover .tl-empty-hint { opacity: 1; }

/* Bella — syringe styling */
.med-card {
  background: rgba(20, 8, 43, 0.5);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid var(--bella-color, #ff8fc4);
  border-radius: 3px;
  padding: 14px 18px; margin-bottom: 10px;
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 14px; align-items: center;
}
body.light-theme .med-card { background: rgba(255,255,255,0.5); border-color: rgba(0,0,0,0.08); border-left-color: var(--bella-color, #c81d77); }
.med-card.given { border-left-color: var(--green); background: rgba(57,255,20,0.05); }
.med-syringe { width: 80px; height: 28px; color: var(--bella-color, #ff8fc4); transition: color 0.3s; }
.med-card.given .med-syringe { color: var(--green); }
.med-info .med-name { font-family: var(--font-display); font-size: 20px; color: var(--ink); letter-spacing: 0.04em; }
.med-info .med-dose { font-size: 12px; color: var(--ink-dim); margin-top: 2px; letter-spacing: 0.05em; }
.med-info .med-slot { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }
.med-card.given .med-info .med-given-at {
  font-family: var(--font-mono); font-size: 11px; color: var(--green);
  letter-spacing: 0.15em; margin-top: 4px;
}
.med-slot-group {
  font-family: var(--font-display); font-size: 22px;
  color: var(--bella-color, #ff8fc4); letter-spacing: 0.05em;
  text-shadow: 0 0 4px var(--bella-color, #ff8fc4);
  text-transform: uppercase;
  margin: 24px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px dashed rgba(255,143,196,0.3);
}

/* work categories */
.work-cols {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 760px) {
  .work-cols { grid-template-columns: 1fr; }
}
.work-col {
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px;
  padding: 14px;
  border-top: 3px solid var(--col-color, var(--pink));
}
body.light-theme .work-col { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
.work-col-title {
  font-family: var(--font-display); font-size: 18px;
  color: var(--col-color, var(--pink));
  text-shadow: 0 0 4px var(--col-color, var(--pink));
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px dashed rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; align-items: baseline;
}
.work-col-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.2em; }
.work-task {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-left: 2px solid var(--col-color, var(--pink));
  border-radius: 3px;
  padding: 10px 12px; margin-bottom: 6px;
  position: relative;
  transition: all 0.15s;
}
.work-task.done { opacity: 0.55; text-decoration: line-through; }
.work-task.timing { border-color: var(--green); box-shadow: 0 0 8px rgba(57,255,20,0.3); }
.work-task .wt-text {
  font-size: 13px; color: var(--ink);
  cursor: text;
}
.work-task .wt-text[contenteditable=true]:focus { outline: 1px dashed var(--cyan); padding: 2px 4px; }
.work-task .wt-meta {
  display: flex; gap: 8px; align-items: center; margin-top: 6px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--ink-faint); letter-spacing: 0.1em; flex-wrap: wrap;
}
.work-task .wt-meta .wt-meta-tag {
  padding: 1px 6px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 2px;
}
.work-task .wt-meta .wt-meta-tag.real { border-color: var(--red); color: var(--red); }
.work-task .wt-meta .wt-meta-tag.internal { border-color: var(--amber); color: var(--amber); }
.work-task .wt-actions { display: flex; gap: 4px; margin-top: 6px; }
.work-task .wt-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.15);
  color: var(--ink-dim); padding: 3px 8px; font-size: 10px;
  font-family: var(--font-mono); letter-spacing: 0.15em; cursor: pointer;
  border-radius: 2px; text-transform: uppercase;
}
.work-task .wt-btn.timer.timing { border-color: var(--green); color: var(--green); background: rgba(57,255,20,0.1); }
.work-task .wt-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.work-task .wt-btn.del:hover { border-color: var(--red); color: var(--red); }
.work-add {
  display: grid; grid-template-columns: 1fr;
  gap: 6px; padding: 10px 0;
  border-top: 1px dashed rgba(255,255,255,0.1);
  margin-top: 8px;
}
.work-metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

/* tabbed sub-nav (used by financials, etc) */
.tabs { display: flex; gap: 0; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.tab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-faint); padding: 10px 18px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.25em; cursor: pointer; text-transform: uppercase;
  transition: all 0.2s;
}
.tab.active { color: var(--accent, var(--cyan)); border-bottom-color: var(--accent, var(--cyan)); text-shadow: 0 0 4px var(--accent, var(--cyan)); }
.tab:hover { color: var(--ink); }

/* Streak display */
.streak-mega {
  text-align: center; padding: 40px 0;
}
.streak-mega .num {
  font-family: var(--font-display);
  font-size: 180px; line-height: 0.85;
  color: var(--red); text-shadow: 0 0 14px var(--red), 0 0 40px var(--red);
}
.streak-mega .unit {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.5em; color: var(--ink-dim); text-transform: uppercase;
  margin-top: 12px;
}

/* mystery card */
.mystery-card {
  background: linear-gradient(135deg, rgba(157,78,221,0.12), rgba(199,125,255,0.05));
  border: 1px solid var(--purple);
  padding: 28px;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.mystery-card::before {
  content: '?'; position: absolute;
  font-family: var(--font-display); font-size: 240px;
  color: var(--purple); opacity: 0.08;
  top: -40px; right: -10px; line-height: 1;
}
.mystery-task {
  font-family: var(--font-serif); font-size: 26px;
  line-height: 1.4; color: white;
  position: relative; z-index: 2;
}
.mystery-meta { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.25em; margin-top: 16px; text-transform: uppercase; position: relative; z-index: 2; }

/* calendar */
.cal-day {
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06);
  border-left: 3px solid var(--cyan-glow);
  padding: 14px 18px;
  margin-bottom: 10px;
  border-radius: 3px;
}
.cal-day-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.cal-day-date { font-family: var(--font-display); font-size: 18px; color: var(--cyan-glow); }
.cal-day-rel { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.2em; }
.cal-item { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; }
.cal-item .src { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.2em; min-width: 90px; }

/* meter ticks */
#insanometer .ticks {
  display: flex; justify-content: space-between;
  margin-top: 4px; font-size: 9px; color: var(--ink-faint);
  letter-spacing: 0.1em; font-family: var(--font-mono);
}
#insanometer .ticks span { opacity: 0.6; }
#ins-fill::after {
  content: ''; position: absolute; right: -1px; top: -3px;
  width: 2px; height: 10px; background: currentColor;
  box-shadow: 0 0 6px currentColor;
}
#insanometer .bar { position: relative; }

/* settings cog */
#settings-btn {
  position: fixed; top: 24px; left: 24px; z-index: 100;
  background: rgba(10,0,26,0.88); border: 1px solid var(--cyan);
  color: var(--cyan); width: 42px; height: 42px;
  border-radius: 4px; cursor: pointer;
  font-family: var(--font-display); font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(0,240,255,0.3);
  backdrop-filter: blur(8px);
  transition: all 0.25s;
}
#settings-btn:hover { transform: rotate(45deg); box-shadow: 0 0 18px var(--cyan); }
body.light-theme #settings-btn { background: rgba(245,236,217,0.92); }

/* settings panel */
#settings {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(420px, 90vw); z-index: 300;
  background: rgba(10,0,26,0.97); backdrop-filter: blur(16px);
  border-left: 1px solid var(--cyan);
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(.2,.7,.3,1);
  overflow-y: auto;
  padding: 32px 28px;
}
body.light-theme #settings { background: rgba(245,236,217,0.97); }
#settings.open { transform: translateX(0); }
#settings h3 {
  font-family: var(--font-display); font-size: 28px;
  color: var(--cyan); letter-spacing: 0.06em;
  margin-bottom: 24px; text-shadow: 0 0 6px var(--cyan);
}
#settings .setting-row {
  padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.08);
}
body.light-theme #settings .setting-row { border-top-color: rgba(0,0,0,0.08); }
#settings .setting-row:first-of-type { border-top: none; }
#settings .setting-label {
  font-size: 11px; letter-spacing: 0.25em; color: var(--ink-dim);
  text-transform: uppercase; margin-bottom: 8px;
}
#settings .setting-hint { font-size: 11px; color: var(--ink-faint); margin-top: 6px; font-family: var(--font-mono); letter-spacing: 0.05em; }

/* toggle */
.toggle {
  position: relative; width: 48px; height: 24px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; cursor: pointer; transition: all 0.2s;
}
body.light-theme .toggle { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; background: var(--ink-dim);
  border-radius: 50%; transition: all 0.2s;
}
.toggle.on { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.toggle.on::after { left: 26px; background: var(--bg-0); }

/* heatmap */
.heatmap {
  display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px;
  margin-top: 8px;
}
.heatmap-cell {
  aspect-ratio: 1; border-radius: 2px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
  transition: transform 0.15s;
}
body.light-theme .heatmap-cell { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
.heatmap-cell:hover { transform: scale(1.4); z-index: 2; }
.heatmap-cell.l0 { background: rgba(255,16,168,0.12); }
.heatmap-cell.l1 { background: rgba(255,16,168,0.3); }
.heatmap-cell.l2 { background: rgba(255,16,168,0.5); }
.heatmap-cell.l3 { background: rgba(255,16,168,0.75); box-shadow: 0 0 4px rgba(255,16,168,0.4); }
.heatmap-cell.l4 { background: var(--pink); box-shadow: 0 0 6px var(--pink); }
.heatmap-cell.void { background: var(--void); box-shadow: 0 0 6px var(--void); }
.heatmap-legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.2em; }
.heatmap-legend .leg-cell { width: 12px; height: 12px; border-radius: 2px; }

/* screensaver */
#screensaver {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg-0); display: none;
  overflow: hidden; cursor: none;
}
#screensaver.active { display: block; animation: ssfade 0.6s ease-out; }
@keyframes ssfade { from { opacity: 0; } to { opacity: 1; } }
#screensaver .ss-clock {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-size: clamp(80px, 14vw, 200px); color: white;
  text-shadow: 0 0 14px var(--pink), 0 0 40px var(--magenta);
  letter-spacing: 0.06em; z-index: 10;
  text-align: center;
}
#screensaver .ss-date {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.4em; color: var(--cyan);

}

/* charts */
.chart-container {

  border-radius: 4px; padding: 18px; margin-bottom: 14px;

}

.chart-container::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.015) 2px 3px);
  pointer-events: none;
}
.chart-title {
  font-family: var(--font-display); font-size: 18px;
  color: var(--accent, var(--amber)); letter-spacing: 0.06em;
  text-shadow: 0 0 4px var(--accent, var(--amber));

}

/* journal */
.journal-entry {
  background: rgba(20, 8, 43, 0.5);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid var(--purple);
  padding: 18px 22px; margin-bottom: 12px;
  border-radius: 3px;
}

.journal-entry .je-date {
  font-family: var(--font-display); font-size: 18px;
  color: var(--purple); letter-spacing: 0.05em;

}
.journal-entry .je-text {
  font-family: var(--font-serif); font-size: 17px; line-height: 1.5;
  color: var(--ink); white-space: pre-wrap;
}

.journal-textarea {
  width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--purple);

}

.mood-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.mood-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.15);
  color: var(--ink-dim); padding: 6px 12px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; cursor: pointer; border-radius: 3px;
  text-transform: uppercase; transition: all 0.2s;
}
body.light-theme .mood-btn { border-color: rgba(0,0,0,0.15); }
.mood-btn:hover { border-color: var(--purple); color: var(--purple); }
.mood-btn.active { border-color: var(--purple); color: var(--purple); background: rgba(157,78,221,0.1); box-shadow: 0 0 6px var(--purple); }

/* spending entry */
.spend-row {
  display: grid; grid-template-columns: 80px 1fr 110px 30px;
  gap: 10px; align-items: center;
  padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06);

}
body.light-theme .spend-row { border-top-color: rgba(0,0,0,0.08); }
.spend-row:first-of-type { border-top: none; }
.spend-row .spend-date { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; }
.spend-row .spend-amt { font-family: var(--font-display); font-size: 18px; color: var(--red); text-align: right; }

/* light theme tweaks */
body.light-theme #hero-title h1 {

}

body.light-theme .stat { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
body.light-theme .exam-block { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
body.light-theme .cal-day { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
body.light-theme .field { background: rgba(255,255,255,0.6); border-color: rgba(0,0,0,0.15); color: var(--ink); }
body.light-theme .check-row { border-top-color: rgba(0,0,0,0.08); }

/* mobile */

/* ========== V3: PRIMARY DAY OPS TILE ========== */
.tile.primary {

.tile.primary .tile-icon { font-size: 24px; margin-bottom: 0; }
.tile.primary h2 { font-size: 36px; margin: 6px 0 4px; }
.tile.primary .dayops-stats {

.tile.primary .dayops-stat {

}
.tile.primary .dayops-stat .ds-label {

}

}
.tile.primary .ds-value.urgent { color: var(--red); text-shadow: 0 0 6px var(--red); }
.tile.primary .ds-value.good { color: var(--green); text-shadow: 0 0 6px var(--green); }
.tile.primary .ds-value.warn { color: var(--amber); text-shadow: 0 0 6px var(--amber); }

/* ========== TIMELINE ========== */
.timeline-wrap {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 0;
  margin-bottom: 18px;
  overflow: hidden;
}
body.light-theme .timeline-wrap { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
.timeline-strip {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scroll-behavior: smooth;
  cursor: grab;
}
.timeline-strip::-webkit-scrollbar { height: 6px; }
.timeline-strip::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
.timeline-strip::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 3px; }
.timeline-track {
  display: inline-flex;
  position: relative;
  height: 110px;
  padding: 16px 0;
}
.timeline-hour {
  display: inline-block;
  width: 120px;
  height: 80px;
  border-right: 1px solid rgba(255,255,255,0.08);
  position: relative;
  vertical-align: top;
  flex-shrink: 0;
}
body.light-theme .timeline-hour { border-right-color: rgba(0,0,0,0.08); }
.timeline-hour.dragover { background: rgba(255,16,168,0.1); }
.timeline-hour::before {
  content: attr(data-label);
  position: absolute; top: -16px; left: 4px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--ink-faint); letter-spacing: 0.2em;
}
.timeline-hour.current { background: rgba(0,240,255,0.04); }
.timeline-hour.past { opacity: 0.55; }
.timeline-hour .quarter {
  width: 25%; height: 100%; display: inline-block;
  border-right: 1px dashed rgba(255,255,255,0.04);
  vertical-align: top;
}
body.light-theme .timeline-hour .quarter { border-right-color: rgba(0,0,0,0.05); }
.timeline-hour .quarter:last-child { border-right: none; }
.now-indicator {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  z-index: 5; pointer-events: none;
}
.now-indicator::before {
  content: 'NOW'; position: absolute; top: -2px; left: 4px;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.3em; color: var(--cyan);
  text-shadow: 0 0 4px var(--cyan);
  background: var(--bg-0); padding: 0 4px;
}
body.light-theme .now-indicator::before { background: var(--bg-0); }
.timeline-item {
  position: absolute;
  top: 22px;
  height: 48px;
  background: var(--accent, var(--pink));
  color: var(--bg-0);
  border-radius: 3px;
  padding: 5px 8px;
  font-family: var(--font-mono); font-size: 11px;
  cursor: grab;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
  box-shadow: 0 0 8px var(--accent-glow, rgba(255,16,168,0.5));
  z-index: 3;
  transition: transform 0.15s, box-shadow 0.15s;
}
.timeline-item:hover { transform: translateY(-2px) scale(1.02); z-index: 4; }
.timeline-item.done { opacity: 0.5; text-decoration: line-through; }
.timeline-item .ti-label { font-weight: 700; letter-spacing: 0.05em; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.timeline-item .ti-time { font-size: 9px; opacity: 0.7; letter-spacing: 0.15em; }
.timeline-item .ti-note { font-size: 10px; opacity: 0.85; font-style: italic; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

/* palette */
.palette {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.palette-chip {
  padding: 8px 12px;
  background: rgba(20, 8, 43, 0.7);
  border: 1px solid var(--accent, var(--pink));
  border-radius: 3px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent, var(--pink));
  letter-spacing: 0.15em;
  cursor: grab; user-select: none;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  text-transform: uppercase;
}
body.light-theme .palette-chip { background: rgba(255,255,255,0.6); }
.palette-chip:hover { background: var(--accent, var(--pink)); color: var(--bg-0); box-shadow: 0 0 8px var(--accent, var(--pink)); }
.palette-chip:active { cursor: grabbing; transform: scale(0.97); }
.palette-chip.dragging { opacity: 0.5; }
.palette-chip .chip-icon { font-family: var(--font-display); font-size: 16px; }

/* before sleep checklist */
.bedlist {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.bedlist-item {
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06);
  border-left: 2px solid var(--accent, var(--ink-faint));
  padding: 8px 12px;
  border-radius: 3px;
  font-size: 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
body.light-theme .bedlist-item { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); }
.bedlist-item .bl-tag {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.2em; color: var(--ink-faint);
  text-transform: uppercase;
}
.bedlist-item.empty {
  color: var(--green); border-left-color: var(--green);
  font-family: var(--font-display); font-size: 16px;
  letter-spacing: 0.1em;
  justify-content: center;
}

/* ========== BELLA ========== */
.bella-card {
  background: rgba(255,182,39,0.05);
  border: 1px solid rgba(255,182,39,0.2);
  border-left: 3px solid var(--amber);
  padding: 18px 22px;
  border-radius: 3px;
  margin-bottom: 14px;
}
body.light-theme .bella-card { background: rgba(255,182,39,0.08); }
.bella-card .bc-title {
  font-family: var(--font-display); font-size: 22px;
  color: var(--amber); letter-spacing: 0.05em;
  text-shadow: 0 0 4px var(--amber);

}

.bella-med {

  gap: 12px; align-items: center;
  padding: 10px 0;
  border-top: 1px solid rgba(255,182,39,0.12);
}
.bella-med:first-of-type { border-top: none; }
.bella-med .bm-syringe { width: 32px; height: 32px; }
.bella-med .bm-name { font-size: 14px; }
.bella-med .bm-dose {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,182,39,0.3);
  color: var(--amber); padding: 4px 8px;
  font-family: var(--font-mono); font-size: 11px;
  border-radius: 3px; width: 80px;
  outline: none;
}
body.light-theme .bella-med .bm-dose { background: rgba(255,255,255,0.4); }
.bella-med .bm-dose:focus { box-shadow: 0 0 4px var(--amber); }
.bella-med .bm-give {
  background: transparent; border: 1px solid var(--amber); color: var(--amber);
  padding: 6px 12px; font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; cursor: pointer; border-radius: 3px;
  text-transform: uppercase; transition: all 0.2s;
}
.bella-med .bm-give:hover { background: var(--amber); color: var(--bg-0); box-shadow: 0 0 8px var(--amber); }
.bella-med.given { opacity: 0.6; }
.bella-med.given .bm-syringe path { fill: var(--green) !important; }
.bella-med .bm-given-time {
  font-family: var(--font-display); font-size: 18px; color: var(--green);
  text-shadow: 0 0 4px var(--green);
}

/* ========== WORK COLUMNS ========== */
.work-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.work-col {
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.08);
  border-top: 3px solid var(--accent, var(--pink));
  border-radius: 3px;
  padding: 14px;
  min-height: 280px;
}
body.light-theme .work-col { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.08); border-top-color: var(--accent, var(--pink)); }
.work-col-mails { --accent: #5cf5ff; --accent-glow: rgba(92,245,255,0.4); }
.work-col-heavy { --accent: #ff3b6e; --accent-glow: rgba(255,59,110,0.4); }
.work-col-fast  { --accent: #39ff14; --accent-glow: rgba(57,255,20,0.4); }
.work-col h4 {
  font-family: var(--font-display); font-size: 18px;
  color: var(--accent); letter-spacing: 0.06em;
  text-shadow: 0 0 4px var(--accent);
  margin-bottom: 12px; text-transform: uppercase;
}
.work-task {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 3px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: grab;
  position: relative;
  transition: all 0.15s;
}
body.light-theme .work-task { background: rgba(255,255,255,0.5); border-color: rgba(0,0,0,0.08); }
.work-task:hover { border-color: var(--accent); }
.work-task.done { opacity: 0.45; }
.work-task.done .wt-text { text-decoration: line-through; }
.work-task.active { border-color: var(--green); box-shadow: 0 0 8px rgba(57,255,20,0.4); }
.work-task .wt-text { font-size: 13px; margin-bottom: 6px; line-height: 1.3; }
.work-task .wt-meta {
  display: flex; gap: 10px; font-size: 10px;
  color: var(--ink-faint); letter-spacing: 0.1em;
  font-family: var(--font-mono); flex-wrap: wrap;
  align-items: center;
}
.work-task .wt-due { color: var(--amber); }
.work-task .wt-due.real { color: var(--red); }
.work-task .wt-time {
  font-family: var(--font-display); font-size: 14px;
  color: var(--green); text-shadow: 0 0 4px var(--green);
}
.work-task .wt-controls {
  display: flex; gap: 4px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04);
}
.work-task .wt-controls button {
  background: transparent; border: 1px solid rgba(255,255,255,0.15);
  color: var(--ink-dim); padding: 3px 8px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.15em; cursor: pointer; border-radius: 2px;
  flex: 1;
}
.work-task .wt-controls button.start { border-color: var(--green); color: var(--green); }
.work-task .wt-controls button.pause { border-color: var(--amber); color: var(--amber); }
.work-task .wt-controls button.done { border-color: var(--cyan); color: var(--cyan); }
.work-task .wt-controls button.del { border-color: var(--red); color: var(--red); }
.work-add-form {
  background: rgba(0,0,0,0.2); padding: 10px;
  border-radius: 3px; margin-top: 10px;
}
.work-add-form input { font-size: 12px; }

@media (max-width: 720px) {
  .timeline-hour { width: 90px; }
  .work-cols { grid-template-columns: 1fr; }
}

/* ========== V4: timeline resize + edit popover ========== */
.timeline-item .ti-resize {
  position: absolute; top: 0; right: 0; bottom: 0; width: 10px;
  cursor: ew-resize; background: rgba(0,0,0,0.15);
  border-radius: 0 3px 3px 0;
  display: flex; align-items: center; justify-content: center;
}
.timeline-item .ti-resize::after { content: '⋮'; color: rgba(0,0,0,0.5); font-size: 12px; }
.timeline-item.resizing { z-index: 6; box-shadow: 0 0 14px var(--accent, var(--pink)); }

.tl-popover {
  position: fixed; z-index: 400;
  background: rgba(10,0,26,0.98); backdrop-filter: blur(12px);
  border: 1px solid var(--cyan);
  border-radius: 6px; padding: 18px;

.tl-popover h4 {

.tl-popover .tlp-row { margin-bottom: 12px; }
.tl-popover .tlp-label { font-size: 10px; letter-spacing: 0.3em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 5px; }

.tl-popover-backdrop {

}

/* sleep toggle pill in day-ops */
.sleep-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 20px;
  border: 1px solid var(--purple); color: var(--purple);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  background: transparent;
}

/* work weekly split bar */
.split-bar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
.split-seg { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--bg-0); font-weight: 700; min-width: 0; transition: flex 0.4s; }

/* ---- storage abstraction (window.storage for Claude, localStorage fallback) ---- */

  async get(key) {
    if (typeof window !== 'undefined' && window.storage && window.storage.get) {
      try { const r = await window.storage.get(key); return r ? r.value : null; }
      catch { return null; }
    }
    try { return localStorage.getItem(key); } catch { return null; }
  },
  async set(key, value) {
    if (typeof window !== 'undefined' && window.storage && window.storage.set) {
      try { await window.storage.set(key, value); return; } catch {}
    }
    try { localStorage.setItem(key, value); } catch {}
  },
  async getJSON(key, fallback) {
    const v = await this.get(key);
    if (!v) return fallback;
    try { return JSON.parse(v); } catch { return fallback; }
  },
  async setJSON(key, value) { await this.set(key, JSON.stringify(value)); }
};

async function loadState() {
  S = await Store.getJSON(STATE_KEY, null);
  if (!S || S.version !== 1) {
    S = DEFAULT_STATE();
    await saveState();
  }
  // patch in any keys added in later builds (forward-compat for saved data)
  const def = DEFAULT_STATE();
  for (const k of Object.keys(def)) {
    if (S[k] === undefined) S[k] = def[k];
  }
  if (!S.settings) S.settings = def.settings;
  for (const k of Object.keys(def.settings)) {
    if (S.settings[k] === undefined) S.settings[k] = def.settings[k];
  }
  if (!S.settings.rates) S.settings.rates = def.settings.rates;
  if (!S.settings.sync) S.settings.sync = def.settings.sync;
  for (const k of Object.keys(def.settings.sync)) {
    if (S.settings.sync[k] === undefined) S.settings.sync[k] = def.settings.sync[k];
  }
  if (!S.syncMeta) S.syncMeta = def.syncMeta;
  if (!S.sleepDays) S.sleepDays = {};
  if (!S.deen.times) S.deen.times = def.deen.times;
  if (!S.journal) S.journal = def.journal;

  // migrate old work.todos → work.tasks
  if (!S.work.tasks) S.work.tasks = [];
  if (S.work.todos && S.work.todos.length && S.work.tasks.length === 0) {
    S.work.tasks = S.work.todos.map(t => ({
      id: t.id, text: t.text, category: 'fast',
      internalDeadline: null, realDeadline: t.due || null,
      priorityOrder: 999, done: !!t.done,
      timeSpentMinutes: 0, activeTimerStart: null,
      createdAt: todayKey(), completedAt: t.done ? todayKey() : null
    }));
  }
  // daily rollover
  if (S.today !== todayKey()) {
    await rolloverDay();
  }

async function saveState() {
  if (!S.syncMeta) S.syncMeta = { updatedAt: null, device: null };
  S.syncMeta.updatedAt = new Date().toISOString();
  await Store.setJSON(STATE_KEY, S);
  // debounced auto push to remote if sync is on
  if (S.settings && S.settings.sync && S.settings.sync.enabled && S.settings.sync.autoSync) {
    SyncEngine.queuePush();
  }
}

async function rolloverDay() {
  // snapshot yesterday into history (including per-module scores for heatmaps)
  const yesterday = S.today;
  S.history = S.history || {};
  const modScores = computeModuleScores();
  S.history[yesterday] = {
    insanometer: calcInsanometerFromState(),
    void: !!S.deen.voidReason,
    voidReason: S.deen.voidReason,
    scores: modScores
  };
  // prune very old history (keep last 365 days)
  const keepFrom = new Date(); keepFrom.setDate(keepFrom.getDate() - 365);
  const cutoff = keepFrom.toISOString().slice(0,10);
  for (const d of Object.keys(S.history)) {
    if (d < cutoff) delete S.history[d];
  }
  // reset daily state
  S.deen.prayers = { fajr: false, dhuhr: false, asr: false, maghrib: false, isha: false };
  S.deen.dhikr = 0;
  S.deen.quran = false;
  S.deen.voidReason = null;
  S.deen.quoteIdx = null;
  S.wellness.pillsChecked = {};
  S.wellness.walking.steps = 0;
  S.studying.studiedToday = false;
  S.mystery.task = null;
  S.mystery.dateAssigned = null;
  // bella daily reset — log given doses to history before clearing
  if (S.bella && S.bella.givenToday) {
    for (const [medId, time] of Object.entries(S.bella.givenToday)) {
      const med = (S.bella.meds || []).find(m => m.id === medId);
      S.bella.log.push({ date: yesterday, medId, name: med ? med.name : 'unknown', dose: med ? med.dose : '', givenAt: time });
    }
    if (S.bella.log.length > 500) S.bella.log = S.bella.log.slice(-500);
    S.bella.givenToday = {};
  }
  // nofap auto-increments via startDate (no daily reset)
  S.today = todayKey();
  S.lastSeen = S.today;
  await saveState();
}

/* compute per-module scores (used for heatmap history) */
function computeModuleScores() {
  const out = {};
  const totalPills = S.wellness.phases.reduce((n, p) => n + p.items.length, 0);
  const pillsDone = Object.values(S.wellness.pillsChecked).filter(Boolean).length;
  const pillScore = totalPills ? pillsDone / totalPills : 0;
  const walkScore = Math.min(1, (S.wellness.walking.steps || 0) / Math.max(1, S.wellness.walking.target));
  out.wellness = pillScore * 0.7 + walkScore * 0.3;
  const prDone = Object.values(S.deen.prayers).filter(Boolean).length;
  out.deen = S.deen.voidReason ? 0 : prDone / 5;
  out.deenVoid = !!S.deen.voidReason;
  const stTodos = S.studying.todos.length;
  const stDone = S.studying.todos.filter(t => t.done).length;
  out.studying = (S.studying.studiedToday ? 0.5 : 0) + (stTodos ? (stDone/stTodos) * 0.5 : 0);
  out.nofap = S.nofap.startDate ? 1 : 0;
  const wkTasks = S.work.tasks || [];
  const wkT = wkTasks.length;
  out.work = wkT ? wkTasks.filter(t => t.done).length / wkT : 0;
  if (S.bella && S.bella.meds) {
    const totalB = S.bella.meds.length;
    const givenB = Object.keys(S.bella.givenToday || {}).length;
    out.bella = totalB ? givenB / totalB : 0;
  }
  out.mystery = S.mystery.task && S.mystery.task.done ? 1 : 0;
  const j = S.journal && S.journal.entries[todayKey()];
  out.journal = (j && j.text && j.text.trim().length > 0) ? 1 : 0;
  return out;
}

/* ============ INSANOMETER CALCULATION ============ */
function calcInsanometerFromState() {
  // If deen voided (missed a prayer past its deadline), score is 0 — full stop.
  checkPrayerDeadlines(); // mutates voidReason if needed
  if (S.deen.voidReason) return 0;

  const scores = [];

  // Deen score: % of prayers prayed (active component)
  const prayersDone = Object.values(S.deen.prayers).filter(Boolean).length;
  // only count prayers whose deadlines have passed OR whose times have started
  const dueCount = countDuePrayers();
  if (dueCount > 0) {
    scores.push({ key: 'deen', score: prayersDone / dueCount, weight: 1.4 });
  }

  // Wellness: % pills checked + walking ratio
  const totalPills = S.wellness.phases.reduce((n, p) => n + p.items.length, 0);
  const pillsDone = Object.values(S.wellness.pillsChecked).filter(Boolean).length;
  const pillScore = totalPills ? pillsDone / totalPills : 1;
  const walkScore = Math.min(1, (S.wellness.walking.steps || 0) / Math.max(1, S.wellness.walking.target));
  scores.push({ key: 'wellness', score: pillScore * 0.7 + walkScore * 0.3, weight: 1 });

  // Studying: studied today binary + todo completion
  const stTodosToday = S.studying.todos.length;
  const stTodosDone = S.studying.todos.filter(t => t.done).length;
  const stTodoScore = stTodosToday ? stTodosDone / stTodosToday : (S.studying.studiedToday ? 1 : 0);
  scores.push({ key: 'mlea', score: (S.studying.studiedToday ? 0.5 : 0) + stTodoScore * 0.5, weight: 1.1 });

  // NoFap: 1 if streak still alive today
  scores.push({ key: 'nofap', score: S.nofap.startDate ? 1 : 0.5, weight: 0.8 });

  // Work todos (using new tasks structure)
  const allWorkTasks = S.work.tasks || [];
  const todayWork = allWorkTasks.filter(t => t.createdAt === todayKey() || (!t.done && t.realDeadline === todayKey()) || (!t.done && t.internalDeadline));
  const wkTotal = todayWork.length || allWorkTasks.filter(t => !t.done).length;
  const wkDone = todayWork.filter(t => t.done).length || allWorkTasks.filter(t => t.completedAt === todayKey()).length;
  if (wkTotal > 0) scores.push({ key: 'work', score: wkDone / wkTotal, weight: 0.9 });

  // Bella meds — count given/total for today
  if (S.bella && S.bella.meds && S.bella.meds.length) {
    const total = S.bella.meds.length;
    const given = Object.keys(S.bella.givenToday || {}).length;
    scores.push({ key: 'bella', score: given / total, weight: 1.0 });
  }

  // Mystery
  if (S.mystery.task) {
    scores.push({ key: 'mystery', score: S.mystery.task.done ? 1 : 0, weight: 0.5 });
  }

  // Journal — counts if today's entry exists and has content
  const j = S.journal && S.journal.entries[todayKey()];
  scores.push({ key: 'journal', score: (j && j.text && j.text.trim().length > 0) ? 1 : 0, weight: 0.6 });

  // Custom modules (treated as checklists)
  for (const m of (S.custom || [])) {
    if (m.type === 'checklist' && m.items && m.items.length) {
      const done = m.items.filter(i => i.done).length;
      scores.push({ key: m.id, score: done / m.items.length, weight: 0.7 });
    }
  }

  if (!scores.length) return 0;
  const totalW = scores.reduce((a, s) => a + s.weight, 0);
  const weighted = scores.reduce((a, s) => a + s.score * s.weight, 0);
  return Math.round((weighted / totalW) * 100);
}

function countDuePrayers() {
  const now = new Date();
  const hm = now.getHours() * 60 + now.getMinutes();
  const order = ['fajr','dhuhr','asr','maghrib','isha'];
  const starts = { fajr: 0, dhuhr: 12*60, asr: 15*60, maghrib: 18*60, isha: 20*60 };
  let n = 0;
  for (const p of order) if (hm >= starts[p]) n++;
  return n || 1;
}

function checkPrayerDeadlines() {
  if (S.deen.voidReason) return;
  if (isSleepDay()) return; // no judgment on recovery days
  const now = new Date();
  const hm = now.getHours() * 60 + now.getMinutes();
  for (const [name, deadline] of Object.entries(S.deen.deadlines)) {
    const [h, m] = deadline.split(':').map(Number);
    const dl = h * 60 + m;
    if (hm > dl && !S.deen.prayers[name]) {
      S.deen.voidReason = name;
      if (S.deen.quoteIdx == null) {
        S.deen.quoteIdx = Math.floor(Math.random() * VOID_QUOTES.length);
      }
      return;
    }
  }
}

  const el = document.getElementById('insanometer');
  const v = document.getElementById('ins-value');
  const f = document.getElementById('ins-fill');
  const b = document.getElementById('ins-breakdown');

  // Sleep / recovery mode — soft-disable

    el.classList.remove('void');
    v.textContent = '☾';
    v.style.color = 'var(--purple)';
    f.style.width = '100%';
    f.style.background = 'var(--purple)';

    document.getElementById('quote-banner').classList.remove('visible');
    renderTileProgress();
    return;
  }

  const score = calcInsanometerFromState();

  v.textContent = score;
  f.style.width = score + '%';

  let color = '#39ff14';

  if (score < 40) color = '#ff3b6e';
  v.style.color = color;
  f.style.background = color;

  } else {

  }

}

function renderTileProgress() {
  // wellness tile
  const totalPills = S.wellness.phases.reduce((n, p) => n + p.items.length, 0);
  const pillsDone = Object.values(S.wellness.pillsChecked).filter(Boolean).length;

  const next = nextUpcomingExam();
  setTileStatus('studying', next ? `${next.name.split(' ')[0]} · ${next.daysLeft}D` : 'NO ACTIVE EXAM', next ? 1 - Math.min(1, (next.daysLeft||0)/14) : 0);

  const sqeDone = S.sqe.roadmap.filter(r => r.done).length;
  setTileStatus('sqe', `${sqeDone}/${S.sqe.roadmap.length} CLEARED`, sqeDone/S.sqe.roadmap.length);

  const streak = nofapStreak();
  setTileStatus('nofap', S.nofap.startDate ? `DAY ${streak}` : 'NO ACTIVE STREAK', S.nofap.startDate ? 1 : 0);

  const wkAllTasks = (S.work.tasks || []);
  const wkOpenTasks = wkAllTasks.filter(t => !t.done);
  const wkDoneToday = wkAllTasks.filter(t => t.completedAt && t.completedAt.startsWith(todayKey())).length;
  setTileStatus('work', wkOpenTasks.length === 0 ? 'INBOX ZERO' : `${wkDoneToday} DONE · ${wkOpenTasks.length} OPEN`, wkAllTasks.length ? (wkDoneToday / Math.max(1, wkDoneToday + wkOpenTasks.length)) : 0);

  if (S.bella && S.bella.meds) {
    const tot = S.bella.meds.length;
    const given = Object.keys(S.bella.givenToday || {}).length;
    setTileStatus('bella', given === tot ? 'ALL GIVEN ✓' : `${given}/${tot} DOSES`, tot ? given/tot : 0);
  }

  const jEntry = S.journal && S.journal.entries[todayKey()];
  const jWritten = jEntry && jEntry.text && jEntry.text.trim().length > 0;
  setTileStatus('journal', jWritten ? 'WRITTEN TODAY' : 'UNWRITTEN', jWritten ? 1 : 0);

  setTileStatus('mystery', S.mystery.task ? (S.mystery.task.done ? 'COMPLETE' : 'AWAITING') : 'NOT DRAWN', S.mystery.task && S.mystery.task.done ? 1 : 0);

  const nw = calcNetWorth();
  setTileStatus('financials', formatEgp(nw) + ' NW', 1);

  setTileStatus('calendar', upcomingAllCount() + ' ITEMS', 1);
}
function setTileStatus(id, text, pct) {
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  if (!tile) return;
  const status = tile.querySelector('.tile-status .status-text');
  const prog = tile.querySelector('.tile-status .progress > span');
  if (status) status.textContent = text;
  if (prog) prog.style.width = (Math.max(0, Math.min(1, pct)) * 100) + '%';
}

/* ============ HELPERS ============ */
function nofapStreak() {
  if (!S.nofap.startDate) return 0;
  return Math.max(0, daysBetween(S.nofap.startDate, todayKey()));
}
function nextUpcomingExam() {
  const t = todayKey();
  const upcoming = S.studying.exams
    .map(e => ({ ...e, daysLeft: daysBetween(t, e.date) }))
    .filter(e => e.daysLeft >= 0)
    .sort((a, b) => a.daysLeft - b.daysLeft);
  return upcoming[0] || null;
}
function calcNetWorth() {
  const f = S.financials;
  return f.thndr + f.liquidArmor + (f.gold24kGrams * f.goldPriceEgpPerG) + (f.silverGrams * f.silverPriceEgpPerG);
}
function formatEgp(n) {
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
  if (n >= 1000) return Math.round(n/1000) + 'K';
  return Math.round(n).toString();
}
function upcomingAllCount() {
  let n = 0;
  S.studying.exams.forEach(e => { if (daysBetween(todayKey(), e.date) >= 0) n++; });
  n += S.studying.todos.filter(t => !t.done).length;
  if (S.work && S.work.tasks) n += S.work.tasks.filter(t => !t.done).length;
  else if (S.work && S.work.todos) n += S.work.todos.filter(t => !t.done).length;
  return n;
}
function uid() { return Math.random().toString(36).slice(2, 9); }

/* count of stuff still missing for today (used by primary tile + bedlist) */
function countBeforeSleep() {
  let n = 0;
  // unprayed prayers (only ones whose start time has passed)
  const now = new Date();
  const hm = now.getHours() * 60 + now.getMinutes();
  const starts = { fajr: 0, dhuhr: 12*60, asr: 15*60, maghrib: 18*60, isha: 20*60 };
  for (const [p, start] of Object.entries(starts)) {
    if (hm >= start && !S.deen.prayers[p] && S.deen.voidReason !== p) n++;
  }
  // pending pills
  const totalPills = S.wellness.phases.reduce((a, p) => a + p.items.length, 0);
  const donePills = Object.values(S.wellness.pillsChecked).filter(Boolean).length;
  n += (totalPills - donePills);
  // walking shortfall (if not yet hit target)
  if ((S.wellness.walking.steps || 0) < S.wellness.walking.target) n++;
  // bella meds not given today
  if (S.bella && S.bella.meds) {
    for (const med of S.bella.meds) {
      if (!S.bella.givenToday || !S.bella.givenToday[med.id]) n++;
    }
  }
  // work tasks open
  if (S.work && S.work.tasks) {
    n += S.work.tasks.filter(t => !t.done).length;
  } else if (S.work && S.work.todos) {
    n += S.work.todos.filter(t => !t.done).length;
  }
  // studying — open todos
  n += S.studying.todos.filter(t => !t.done).length;
  if (!S.studying.studiedToday) n++;
  // journal — not written today
  const j = S.journal && S.journal.entries[todayKey()];
  if (!j || !j.text || !j.text.trim()) n++;
  // mystery — not done
  if (S.mystery.task && !S.mystery.task.done) n++;
  return n;
}

/* expose reset for inline onclick */
window.resetDayConfirm = async function() {
  if (!confirm('RESET TODAY?\n\nThis will clear ALL of today\'s checkboxes:\n• prayers + void state\n• pills + walking steps\n• bella med doses\n• work timers (totals preserved)\n• mystery task\n• timeline blocks\n• journal entry stays (use settings to wipe)\n\nUse this when your sleep schedule shifts the day boundary.\nThis cannot be undone.')) return;
  // clear daily state
  S.deen.prayers = { fajr: false, dhuhr: false, asr: false, maghrib: false, isha: false };
  S.deen.dhikr = 0;
  S.deen.quran = false;
  S.deen.voidReason = null;
  S.deen.quoteIdx = null;
  S.wellness.pillsChecked = {};
  S.wellness.walking.steps = 0;
  S.studying.studiedToday = false;
  S.mystery.task = null;
  S.mystery.dateAssigned = null;
  if (S.bella) { S.bella.givenToday = {}; }
  if (S.timeline && S.timeline.blocks) { S.timeline.blocks[todayKey()] = []; }
  // pause any active work timers but keep accumulated time
  if (S.work && S.work.tasks) {
    S.work.tasks.forEach(t => {
      if (t.activeTimerStart) {
        const elapsed = (Date.now() - t.activeTimerStart) / 60000;
        t.timeSpentMinutes = (t.timeSpentMinutes || 0) + elapsed;
        t.activeTimerStart = null;
      }
    });
  }
  await saveState();
  renderGrid();
  renderInsanometer();
  renderStreakBanner();
  closeDetail();
};

    { id: 'dhuhr',   label: 'DHUHR',   time: 'Midday' },
    { id: 'asr',     label: 'ASR',     time: 'Afternoon' },
    { id: 'maghrib', label: 'MAGHRIB', time: 'Sunset' },
    { id: 'isha',    label: 'ISHA',    time: 'Night' }
  ];

  let html = `<div class="section">
    <div class="section-title" style="--accent:#ffb627">FIVE PILLARS · TODAY</div>
    ${S.deen.voidReason ? `<div style="padding:12px 16px;border:1px solid var(--void);background:rgba(255,0,60,0.08);border-radius:3px;margin-bottom:14px;color:var(--void);font-size:13px;letter-spacing:0.2em">
      ⚠ ${S.deen.voidReason.toUpperCase()} DEADLINE PASSED. INSANOMETER VOIDED. RECOVER TOMORROW.
    </div>` : ''}
    <div class="prayer-grid">
      ${prayers.map(p => {
        const done = S.deen.prayers[p.id];
        const missed = S.deen.voidReason === p.id;
        const adhan = (S.deen.times && S.deen.times[p.id]) || '—';
        return `<div class="prayer ${done ? 'done' : ''} ${missed ? 'missed' : ''}" data-prayer="${p.id}">
          <div class="prayer-check">${missed ? '✕' : '✓'}</div>
          <div class="prayer-name">${p.label}</div>
          <div class="prayer-time">adhan ${adhan} · cut-off ${S.deen.deadlines[p.id]}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn ghost" id="prayer-reset-all">RESET TODAY'S PRAYERS</button>
      <button class="btn ghost" id="prayer-undo-void" ${S.deen.voidReason ? '' : 'style="display:none"'}>UNDO VOID · MISCLICK</button>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);letter-spacing:0.1em;margin-top:8px">click a prayer to toggle · reset clears all of today · undo void rescues a misclicked void</div>
  </div>`;

  html += `<div class="section">
    <div class="section-title" style="--accent:#ffb627">DHIKR + QURAN</div>
    <div class="card">
      <div class="row" style="gap:14px">
        <div class="stat" style="--accent:#ffb627">
          <span class="stat-label">DHIKR COUNT</span>
          <span class="stat-value" id="dhikr-val">${S.deen.dhikr}</span>
          <span class="stat-sub">today</span>
        </div>
        <div class="row" style="flex-direction:column;gap:8px;flex:1">
          <button class="btn" id="dhikr-1" style="border-color:var(--amber);color:var(--amber)">+1</button>
          <button class="btn" id="dhikr-33" style="border-color:var(--amber);color:var(--amber)">+33</button>
          <button class="btn ghost" id="dhikr-reset">RESET</button>
        </div>
      </div>
      <div class="check-row" style="margin-top:14px;border-top:1px dashed rgba(255,255,255,0.08);padding-top:14px">
        <input type="checkbox" id="quran-check" ${S.deen.quran ? 'checked' : ''} style="accent-color: var(--amber)">
        <label for="quran-check">Recited Quran today (any amount)</label>
      </div>
    </div>
  </div>`;

  html += `<div class="section">
    <div class="section-title" style="--accent:#ffb627">PRAYER DEADLINES</div>
    <div class="card">
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:12px">${S.settings && S.settings.autoPrayerTimes ? `Auto-fetched from Aladhan API for ${S.settings.location.city}, ${S.settings.location.country}. Toggle off in Settings to edit manually.` : 'Default deadlines (Egypt approximate). Past a deadline with prayer unchecked = void day.'}</div>
      <div class="row" style="margin-bottom:12px;gap:8px">
        <button class="btn ghost" id="prayer-fetch">↻ FETCH PRAYER TIMES NOW</button>
        <span id="prayer-fetch-status" style="font-size:11px;color:var(--ink-faint);letter-spacing:0.15em"></span>
      </div>
      ${prayers.map(p => `<div class="row" style="margin-bottom:8px;gap:10px">
        <span style="font-family:var(--font-display);font-size:18px;color:var(--amber);min-width:90px">${p.label}</span>
        <input type="time" class="field deadline-input" data-prayer="${p.id}" value="${S.deen.deadlines[p.id]}" style="flex:0 1 140px" ${S.settings && S.settings.autoPrayerTimes ? 'disabled' : ''}>
      </div>`).join('')}
    </div>
  </div>`;

  c.innerHTML = html;

  // wire reset buttons
  document.getElementById('prayer-reset-all').addEventListener('click', async () => {
    if (!confirm('Reset all of today\'s prayer checkboxes? (Does not undo a void state — use the other button for that.)')) return;
    S.deen.prayers = { fajr: false, dhuhr: false, asr: false, maghrib: false, isha: false };
    await saveState();
    renderDeen(c);
    renderInsanometer();
  });
  const undoBtn = document.getElementById('prayer-undo-void');
  if (undoBtn) undoBtn.addEventListener('click', async () => {
    if (!confirm('Undo the void state? Use only if you actually prayed but the deadline triggered as a misclick.')) return;
    S.deen.voidReason = null;
    S.deen.quoteIdx = null;
    await saveState();
    renderDeen(c);
    renderInsanometer();
  });
  document.getElementById('prayer-fetch').addEventListener('click', async () => {
    const statusEl = document.getElementById('prayer-fetch-status');
    statusEl.textContent = 'FETCHING...';
    statusEl.style.color = 'var(--cyan)';
    const ok = await fetchPrayerTimes(true);
    statusEl.textContent = ok ? '✓ UPDATED' : '✕ FETCH FAILED';
    statusEl.style.color = ok ? 'var(--green)' : 'var(--red)';
    if (ok) { renderDeen(c); renderInsanometer(); }
  });

  // wire prayer toggles
  c.querySelectorAll('[data-prayer]').forEach(el => {
    if (el.tagName === 'DIV') {
      el.addEventListener('click', async () => {
        const p = el.dataset.prayer;
        if (S.deen.voidReason === p) return; // can't toggle a missed one
        S.deen.prayers[p] = !S.deen.prayers[p];
        await saveState();
        renderDeen(c);
        renderInsanometer();
      });
    }
  });
  c.querySelectorAll('.deadline-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      S.deen.deadlines[inp.dataset.prayer] = inp.value;
      await saveState();
      renderInsanometer();
    });
  });
  document.getElementById('dhikr-1').addEventListener('click', async () => {
    S.deen.dhikr++;
    document.getElementById('dhikr-val').textContent = S.deen.dhikr;
    await saveState();
  });
  document.getElementById('dhikr-33').addEventListener('click', async () => {
    S.deen.dhikr += 33;
    document.getElementById('dhikr-val').textContent = S.deen.dhikr;
    await saveState();
  });
  document.getElementById('dhikr-reset').addEventListener('click', async () => {
    S.deen.dhikr = 0;
    document.getElementById('dhikr-val').textContent = 0;
    await saveState();
  });
  document.getElementById('quran-check').addEventListener('change', async (e) => {
    S.deen.quran = e.target.checked;
    await saveState();
  });
}

    <div class="card">
      <div id="studying-list">${S.studying.todos.map(t => itemRowHtml(t, 'studying-todo')).join('') || '<div style="color:var(--ink-faint);font-size:13px">no tasks · add one ↓</div>'}</div>
