/* --- NoFap --- */
function renderNofap(c) {
  const streak = nofapStreak();
  let html = `<div class="section">
    <div class="streak-mega">
      <div class="num">${streak}</div>
      <div class="unit">${S.nofap.startDate ? 'CONSECUTIVE DAYS' : 'NO ACTIVE STREAK'}</div>
      ${S.nofap.startDate ? `<div style="margin-top:14px;color:var(--ink-faint);font-size:11px;letter-spacing:0.3em">SINCE ${S.nofap.startDate}</div>` : ''}
    </div>
  </div>`;

  html += `<div class="section">
    <div class="row" style="gap:12px">
      <div class="stat" style="--accent:#ff3b6e">
        <span class="stat-label">PERSONAL BEST</span>
        <span class="stat-value">${S.nofap.best}</span>
        <span class="stat-sub">days</span>
      </div>
      <div class="stat">
        <span class="stat-label">TOTAL RUNS</span>
        <span class="stat-value" style="color:var(--ink-dim)">${S.nofap.history.length}</span>
        <span class="stat-sub">attempts logged</span>
      </div>
    </div>
  </div>`;

  html += `<div class="section">
    <div class="card">
      ${!S.nofap.startDate ? `
        <div style="font-size:14px;margin-bottom:14px">No active streak. Start one now to begin counting.</div>
        <button class="btn" id="nofap-start" style="border-color:var(--green);color:var(--green)">START STREAK · TODAY</button>
      ` : `
        <div style="font-size:14px;margin-bottom:14px">If today was a reset, log it here. The streak ends, your best is preserved, and tomorrow you can start again.</div>
        <button class="btn danger" id="nofap-reset">LOG RESET</button>
      `}
    </div>
  </div>`;

  if (S.nofap.history.length) {
    html += `<div class="section">
      <div class="section-title" style="--accent:#ff3b6e">PAST RUNS</div>
      <div class="card">
        ${S.nofap.history.slice().reverse().map(h => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:13px">
          <span style="color:var(--ink-dim)">${h.start} → ${h.end}</span>
          <span style="color:var(--red);font-family:var(--font-display);font-size:18px">${h.days}d</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  c.innerHTML = html;
  const startBtn = document.getElementById('nofap-start');
  if (startBtn) startBtn.addEventListener('click', async () => {
    S.nofap.startDate = todayKey();
    await saveState();
    renderNofap(c);
    renderInsanometer();
  });
  const resetBtn = document.getElementById('nofap-reset');
  if (resetBtn) resetBtn.addEventListener('click', async () => {
    if (!confirm('Log a reset for today? This ends the current streak.')) return;
    const days = nofapStreak();
    S.nofap.history.push({ start: S.nofap.startDate, end: todayKey(), days });
    if (days > S.nofap.best) S.nofap.best = days;
    S.nofap.startDate = null;
    await saveState();
    renderNofap(c);
    renderInsanometer();
  });
}

/* --- Work --- */
function renderWork(c) {
  // ensure new shape
  if (!S.work.tasks) S.work.tasks = [];
  if (S.work.todos && S.work.todos.length && !S.work.migrated) {
    // migrate old todos into 'fast' category
    S.work.todos.forEach(t => {
      S.work.tasks.push({
        id: t.id || uid(), text: t.text, category: 'fast',
        internalDeadline: null, realDeadline: t.due || null,
        priorityOrder: 0, done: !!t.done,
        timeSpentMinutes: 0, activeTimerStart: null,
        createdAt: new Date().toISOString(), completedAt: null
      });
    });
    S.work.migrated = true;
    S.work.todos = [];
    saveState();
  }
  if (!S.work.metric) S.work.metric = {}; // { 'YYYY-MM-DD': { totalMin, completed } }

  const cats = [
    { id: 'mails', label: 'MAILS · TO SEND', cls: 'work-col-mails' },
    { id: 'heavy', label: 'HEAVY · DEEP WORK', cls: 'work-col-heavy' },
    { id: 'fast',  label: 'FAST · QUICK WINS', cls: 'work-col-fast' }
  ];

  const formatDuration = (min) => {
    const m = Math.round(min);
    if (m < 60) return m + 'm';
    return Math.floor(m/60) + 'h ' + (m%60) + 'm';
  };
  const liveMinutes = (t) => {
    const base = t.timeSpentMinutes || 0;
    if (t.activeTimerStart) return base + (Date.now() - t.activeTimerStart) / 60000;
    return base;
  };

  // today's totals
  const today = todayKey();
  const todayTasks = S.work.tasks.filter(t => (t.completedAt || '').startsWith(today));
  const todayMinutes = S.work.tasks.reduce((a, t) => a + (t.activeTimerStart ? (Date.now() - t.activeTimerStart)/60000 : 0), 0)
    + (S.work.metric[today]?.totalMin || 0);
  const todayDone = todayTasks.length;

  const render = () => {
    let html = `<div class="section">
      <div class="row" style="gap:12px;margin-bottom:18px">
        <div class="stat" style="--accent:#39ff14">
          <span class="stat-label">TIME TODAY</span>
          <span class="stat-value">${formatDuration(todayMinutes)}</span>
          <span class="stat-sub">tracked actively</span>
        </div>
        <div class="stat" style="--accent:#5cf5ff">
          <span class="stat-label">COMPLETED</span>
          <span class="stat-value">${todayDone}</span>
          <span class="stat-sub">tasks today</span>
        </div>
        <div class="stat" style="--accent:#ff10a8">
          <span class="stat-label">OPEN</span>
          <span class="stat-value">${S.work.tasks.filter(t => !t.done).length}</span>
          <span class="stat-sub">across all columns</span>
        </div>
      </div>
    </div>`;

    html += `<div class="work-cols">`;
    cats.forEach(cat => {
      const tasks = S.work.tasks
        .filter(t => t.category === cat.id && !t.done)
        .sort((a, b) => (a.priorityOrder || 0) - (b.priorityOrder || 0));
      html += `<div class="work-col ${cat.cls}" data-cat="${cat.id}">
        <h4>${cat.label}</h4>
        <div class="work-task-list" data-list-cat="${cat.id}">
          ${tasks.map(t => {
            const active = !!t.activeTimerStart;
            const spent = liveMinutes(t);
            const realOverdue = t.realDeadline && daysBetween(today, t.realDeadline) < 0;
            const internalSoon = t.internalDeadline && daysBetween(today, t.internalDeadline) <= 1;
            return `<div class="work-task ${active ? 'active' : ''}" data-tid="${t.id}" draggable="true">
              <div class="wt-text">${escapeHtml(t.text)}</div>
              <div class="wt-meta">
                ${t.internalDeadline ? `<span class="wt-due ${internalSoon ? '' : ''}">⏱ ${t.internalDeadline}</span>` : ''}
                ${t.realDeadline ? `<span class="wt-due real ${realOverdue ? '' : ''}">⚠ ${t.realDeadline}${realOverdue ? ' (OVERDUE)' : ''}</span>` : ''}
                <span class="wt-time">${spent > 0 ? formatDuration(spent) : '0m'}</span>
              </div>
              <div class="wt-controls">
                ${active
                  ? `<button class="pause" data-action="pause">⏸ STOP</button>`
                  : `<button class="start" data-action="start">▶ START</button>`}
                <button class="done" data-action="done">✓ DONE</button>
                <button data-action="edit">EDIT</button>
                <button class="del" data-action="del">×</button>
              </div>
            </div>`;
          }).join('') || '<div style="color:var(--ink-faint);font-size:11px;text-align:center;padding:14px;letter-spacing:0.1em">EMPTY · DRAG OR ADD ↓</div>'}
        </div>
        <div class="work-add-form" data-add-cat="${cat.id}">
          <input type="text" class="field" placeholder="new ${cat.id} task" data-input="text" style="font-size:12px;margin-bottom:6px">
          <div class="row" style="gap:6px;margin-bottom:6px">
            <input type="date" class="field" data-input="internal" title="internal deadline (defaults to today)" value="${todayKey()}" style="flex:1;font-size:11px;padding:6px 8px">
            <input type="date" class="field" data-input="real" title="real deadline (optional)" style="flex:1;font-size:11px;padding:6px 8px">
          </div>
          <button class="btn" data-add-btn style="width:100%;font-size:10px;padding:6px;border-color:var(--accent);color:var(--accent)">+ ADD TO ${cat.id.toUpperCase()}</button>
        </div>
      </div>`;
    });
    html += `</div>`;

    // metric chart — last 14 days
    const days = [];
    const now = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const k = d.toISOString().slice(0, 10);
      const min = i === 0 ? todayMinutes : (S.work.metric[k]?.totalMin || 0);
      const completed = i === 0 ? todayDone : (S.work.metric[k]?.completed || 0);
      days.push({ k, label: d.getDate(), min, completed });
    }
    const maxMin = Math.max(60, ...days.map(d => d.min));
    html += `<div class="section" style="margin-top:24px">
      <div class="section-title" style="--accent:#ff10a8">14-DAY METRIC</div>
      <div class="chart-container" style="--accent:#ff10a8">
        <div class="chart-title">MINUTES TRACKED · LAST 14 DAYS</div>
        <svg viewBox="0 0 600 200" style="width:100%;height:auto" id="work-chart">
          ${days.map((d, i) => {
            const x = 30 + i * 40;
            const h = (d.min / maxMin) * 140;
            return `<g>
              <rect x="${x}" y="${170 - h}" width="26" height="${h}" fill="#ff10a8" opacity="${d.k === today ? 1 : 0.75}">
                <title>${d.k} · ${formatDuration(d.min)} · ${d.completed} done</title>
              </rect>
              <text x="${x + 13}" y="190" text-anchor="middle" fill="#b39ad8" font-family="JetBrains Mono" font-size="10">${d.label}</text>
              ${d.min > 0 ? `<text x="${x + 13}" y="${170 - h - 4}" text-anchor="middle" fill="#f5e9ff" font-family="VT323" font-size="13">${Math.round(d.min)}</text>` : ''}
            </g>`;
          }).join('')}
          <line x1="20" y1="170" x2="580" y2="170" stroke="#6a5b8a" stroke-width="0.5"/>
        </svg>
      </div>
    </div>`;

    // weekly category split (last 7 days)
    const weekCat = { mails: 0, heavy: 0, fast: 0 };
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = d.toISOString().slice(0, 10);
      const bc = (S.work.metric[k] && S.work.metric[k].byCategory) || {};
      weekCat.mails += bc.mails || 0;
      weekCat.heavy += bc.heavy || 0;
      weekCat.fast += bc.fast || 0;
      // include live time today for active tasks
      if (i === 0) {
        S.work.tasks.forEach(t => {
          if (t.activeTimerStart) weekCat[t.category] = (weekCat[t.category] || 0) + (Date.now() - t.activeTimerStart)/60000;
        });
      }
    }
    const weekTotal = weekCat.mails + weekCat.heavy + weekCat.fast;
    const pct = (v) => weekTotal > 0 ? (v / weekTotal) * 100 : 0;
    html += `<div class="section">
      <div class="section-title" style="--accent:#ff10a8">THIS WEEK · TIME SPLIT</div>
      <div class="chart-container" style="--accent:#ff10a8">
        <div class="chart-title">WHERE THE HOURS WENT · 7 DAYS</div>
        ${weekTotal > 0 ? `
        <div class="split-bar">
          ${weekCat.mails > 0 ? `<div class="split-seg" style="flex:${pct(weekCat.mails)};background:#5cf5ff">${pct(weekCat.mails) > 12 ? Math.round(pct(weekCat.mails))+'%' : ''}</div>` : ''}
          ${weekCat.heavy > 0 ? `<div class="split-seg" style="flex:${pct(weekCat.heavy)};background:#ff3b6e">${pct(weekCat.heavy) > 12 ? Math.round(pct(weekCat.heavy))+'%' : ''}</div>` : ''}
          ${weekCat.fast > 0 ? `<div class="split-seg" style="flex:${pct(weekCat.fast)};background:#39ff14">${pct(weekCat.fast) > 12 ? Math.round(pct(weekCat.fast))+'%' : ''}</div>` : ''}
        </div>
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:11px;letter-spacing:0.15em;color:var(--ink-dim)">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#5cf5ff;display:inline-block"></span>MAILS · ${formatDuration(weekCat.mails)}</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#ff3b6e;display:inline-block"></span>HEAVY · ${formatDuration(weekCat.heavy)}</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#39ff14;display:inline-block"></span>FAST · ${formatDuration(weekCat.fast)}</span>
        </div>
        <div style="margin-top:14px;font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--ink)">"${workVerdict(weekCat, weekTotal)}"</div>
        ` : '<div style="color:var(--ink-faint);font-size:13px;text-align:center;padding:14px">complete tasks with the timer running to populate this</div>'}
      </div>
    </div>`;

    // completed today
    const doneToday = S.work.tasks.filter(t => t.done && (t.completedAt || '').startsWith(today));
    if (doneToday.length) {
      html += `<div class="section">
        <div class="section-title" style="--accent:#39ff14">CLEARED TODAY · ${doneToday.length}</div>
        <div class="card">
          ${doneToday.map(t => `<div class="row between" style="padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:13px">
            <span>${escapeHtml(t.text)}</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--green);letter-spacing:0.1em">${formatDuration(t.timeSpentMinutes || 0)} · ${t.category}</span>
          </div>`).join('')}
        </div>
      </div>`;
    }

    c.innerHTML = html;

    // wire add forms
    c.querySelectorAll('[data-add-cat]').forEach(form => {
      const cat = form.dataset.addCat;
      form.querySelector('[data-add-btn]').addEventListener('click', async () => {
        const text = form.querySelector('[data-input="text"]').value.trim();
        if (!text) return;
        const internal = form.querySelector('[data-input="internal"]').value || todayKey();
        const real = form.querySelector('[data-input="real"]').value || null;
        S.work.tasks.push({
          id: uid(), text, category: cat,
          internalDeadline: internal, realDeadline: real,
          priorityOrder: S.work.tasks.filter(t => t.category === cat).length,
          done: false,
          timeSpentMinutes: 0, activeTimerStart: null,
          createdAt: new Date().toISOString(), completedAt: null
        });
        await saveState();
        render(); renderTileProgress();
      });
    });

    // wire task controls
    c.querySelectorAll('.work-task').forEach(taskEl => {
      const tid = taskEl.dataset.tid;
      const task = S.work.tasks.find(t => t.id === tid);
      if (!task) return;
      taskEl.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const action = btn.dataset.action;
          if (action === 'start') {
            // pause any other active timer
            S.work.tasks.forEach(t => {
              if (t.activeTimerStart) {
                t.timeSpentMinutes = (t.timeSpentMinutes || 0) + (Date.now() - t.activeTimerStart) / 60000;
                t.activeTimerStart = null;
              }
            });
            task.activeTimerStart = Date.now();
          } else if (action === 'pause') {
            if (task.activeTimerStart) {
              task.timeSpentMinutes = (task.timeSpentMinutes || 0) + (Date.now() - task.activeTimerStart) / 60000;
              task.activeTimerStart = null;
            }
          } else if (action === 'done') {
            if (task.activeTimerStart) {
              task.timeSpentMinutes = (task.timeSpentMinutes || 0) + (Date.now() - task.activeTimerStart) / 60000;
              task.activeTimerStart = null;
            }
            task.done = true;
            task.completedAt = new Date().toISOString();
            // update metric (total + per-category)
            const k = todayKey();
            if (!S.work.metric[k]) S.work.metric[k] = { totalMin: 0, completed: 0, byCategory: {} };
            if (!S.work.metric[k].byCategory) S.work.metric[k].byCategory = {};
            const mins = task.timeSpentMinutes || 0;
            S.work.metric[k].totalMin = (S.work.metric[k].totalMin || 0) + mins;
            S.work.metric[k].completed = (S.work.metric[k].completed || 0) + 1;
            S.work.metric[k].byCategory[task.category] = (S.work.metric[k].byCategory[task.category] || 0) + mins;
            // reset task time since it's accounted in metric
            task.timeSpentMinutes = 0;
          } else if (action === 'edit') {
            const newText = prompt('Edit task:', task.text);
            if (newText !== null && newText.trim()) task.text = newText.trim();
          } else if (action === 'del') {
            if (!confirm('Delete this task?')) return;
            S.work.tasks = S.work.tasks.filter(t => t.id !== tid);
          }
          await saveState();
          render(); renderTileProgress();
        });
      });
    });
  };
  render();

  // refresh active timers visually each 10s while open
  if (window.__workTimer) clearInterval(window.__workTimer);
  window.__workTimer = setInterval(() => {
    if (!document.getElementById('detail').classList.contains('open')) {
      clearInterval(window.__workTimer); window.__workTimer = null; return;
    }
    if (S.work.tasks.some(t => t.activeTimerStart)) render();
  }, 10000);
}

/* --- Calendar (aggregates) --- */
function renderCalendar(c) {
  const today = todayKey();
  const items = [];
  // exams
  S.studying.exams.forEach(e => {
    const d = daysBetween(today, e.date);
    if (d >= 0) items.push({ date: e.date, daysLeft: d, source: 'MLEA EXAM', text: e.name + ' (weight ' + e.weight + ')' });
  });
  // studying todos with due
  S.studying.todos.filter(t => !t.done && t.due).forEach(t => {
    const d = daysBetween(today, t.due);
    if (d >= 0) items.push({ date: t.due, daysLeft: d, source: 'MLEA TODO', text: t.text });
  });
  // work tasks with internal or real deadlines
  const wkSource = (S.work && S.work.tasks) ? S.work.tasks : (S.work.todos || []);
  wkSource.filter(t => !t.done).forEach(t => {
    const due = t.realDeadline || t.internalDeadline || t.due;
    if (!due) return;
    const d = daysBetween(today, due);
    if (d >= 0) items.push({
      date: due, daysLeft: d,
      source: t.realDeadline ? 'WORK · REAL' : 'WORK',
      text: (t.category ? `[${t.category}] ` : '') + t.text
    });
  });
  items.sort((a, b) => a.daysLeft - b.daysLeft);

  // group by date
  const groups = {};
  items.forEach(it => { (groups[it.date] = groups[it.date] || []).push(it); });

  let html = `<div class="section">
    <div class="section-title" style="--accent:#5cf5ff">UPCOMING · AGGREGATED</div>
    <div style="font-size:12px;color:var(--ink-faint);margin-bottom:14px;letter-spacing:0.1em">Pulled from exams + mlea todos + work todos with due dates.</div>`;
  if (!items.length) {
    html += '<div style="color:var(--ink-faint);font-size:14px">No upcoming items. Quiet skies.</div>';
  } else {
    Object.keys(groups).sort().forEach(date => {
      const dl = groups[date][0].daysLeft;
      const relLabel = dl === 0 ? 'TODAY' : dl === 1 ? 'TOMORROW' : `IN ${dl} DAYS`;
      html += `<div class="cal-day">
        <div class="cal-day-head">
          <div class="cal-day-date">${formatLong(new Date(date + 'T00:00:00'))}</div>
          <div class="cal-day-rel">${relLabel}</div>
        </div>
        ${groups[date].map(it => `<div class="cal-item">
          <span class="src">${it.source}</span>
          <span>${it.text}</span>
        </div>`).join('')}
      </div>`;
    });
  }
  html += '</div>';
  c.innerHTML = html;
}

/* --- Mystery --- */
function renderMystery(c) {
  // assign today's task if not assigned or stale
  if (!S.mystery.task || S.mystery.dateAssigned !== todayKey()) {
    const idx = Math.floor(Math.random() * MYSTERY_TASKS.length);
    S.mystery.task = { id: uid(), text: MYSTERY_TASKS[idx], done: false };
    S.mystery.dateAssigned = todayKey();
    saveState();
  }

  const t = S.mystery.task;
  let html = `<div class="section">
    <div class="mystery-card">
      <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.3em;color:var(--purple);margin-bottom:14px;position:relative;z-index:2">TODAY'S DIRECTIVE</div>
      <div class="mystery-task">"${t.text}"</div>
      <div class="mystery-meta">${todayKey()} · ONE TASK · ONE DAY</div>
      <div style="margin-top:24px;position:relative;z-index:2">
        ${t.done
          ? '<div style="color:var(--green);font-family:var(--font-display);font-size:24px;letter-spacing:0.1em">✓ COMPLETED</div>'
          : '<button class="btn" id="mystery-done" style="border-color:var(--purple);color:var(--purple)">MARK COMPLETE</button>'
        }
        <button class="btn ghost" id="mystery-reroll" style="margin-left:8px">REROLL</button>
      </div>
    </div>
  </div>`;
  c.innerHTML = html;
  const doneBtn = document.getElementById('mystery-done');
  if (doneBtn) doneBtn.addEventListener('click', async () => {
    S.mystery.task.done = true;
    await saveState();
    renderMystery(c);
    renderInsanometer();
  });
  document.getElementById('mystery-reroll').addEventListener('click', async () => {
    if (!confirm('Reroll today\'s task? You can only do this if you really got an impossible one.')) return;
    S.mystery.task = null;
    await saveState();
    renderMystery(c);
    renderInsanometer();
  });
}

    } else if (activeTab === 'reports') {
      wireSpendingReport(c, f, fmt, sym);
    }
  };
  render();
}

/* Spending report renderer — quirky retro charts */
function renderSpendingReport(f, cur, rate, sym, fmt) {
  // Last 6 months by category
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = d.toISOString().slice(0, 7);
    const label = d.toLocaleDateString('en-US', { month: 'short' });
    const home = (f.spending.home || []).filter(e => e.date.startsWith(k)).reduce((a, e) => a + e.amount, 0);
    const self = (f.spending.self || []).filter(e => e.date.startsWith(k)).reduce((a, e) => a + e.amount, 0);
    months.push({ k, label, home, self, total: home + self });
  }
  const maxVal = Math.max(1, ...months.map(m => m.total));
  const thisM = months[months.length - 1];
  const lastM = months[months.length - 2] || { total: 0 };
  const delta = lastM.total > 0 ? ((thisM.total - lastM.total) / lastM.total) * 100 : 0;

  let html = `<div class="section">
    <div class="row" style="gap:12px;margin-bottom:14px">
      <div class="stat" style="--accent:#f0c419">
        <span class="stat-label">THIS MONTH</span>
        <span class="stat-value">${fmt(thisM.total)}</span>
        <span class="stat-sub">${sym} · total burn</span>
      </div>
      <div class="stat" style="--accent:${delta > 0 ? '#ff3b6e' : '#39ff14'}">
        <span class="stat-label">VS LAST MONTH</span>
        <span class="stat-value">${delta > 0 ? '+' : ''}${delta.toFixed(0)}%</span>
        <span class="stat-sub">${delta > 0 ? 'spending UP · audit' : delta < 0 ? 'discipline holding' : 'first month'}</span>
      </div>

  // Bar chart — 6 months
  html += `<div class="chart-container" style="--accent:#f0c419">
    <div class="chart-title">6-MONTH BURN · ${sym}</div>
    <svg viewBox="0 0 600 240" style="width:100%;height:auto" id="spend-chart">
      ${months.map((m, i) => {
        const x = 40 + i * 90;
        const homeH = (m.home / maxVal) * 160;
        const selfH = (m.self / maxVal) * 160;
        const baseY = 200;
        return `<g>
          <rect x="${x}" y="${baseY - homeH}" width="32" height="${homeH}" fill="#ff3b6e" opacity="0.85">
            <title>HOME · ${fmt(m.home)} ${sym}</title>
          </rect>
          <rect x="${x + 36}" y="${baseY - selfH}" width="32" height="${selfH}" fill="#c77dff" opacity="0.85">
            <title>SELF · ${fmt(m.self)} ${sym}</title>
          </rect>
          <text x="${x + 34}" y="220" text-anchor="middle" fill="#b39ad8" font-family="JetBrains Mono" font-size="11" letter-spacing="2">${m.label.toUpperCase()}</text>
          <text x="${x + 34}" y="${baseY - Math.max(homeH, selfH) - 6}" text-anchor="middle" fill="#f5e9ff" font-family="VT323" font-size="14">${fmt(m.total)}</text>
        </g>`;
      }).join('')}
      <line x1="30" y1="200" x2="580" y2="200" stroke="#6a5b8a" stroke-width="0.5"/>
    </svg>
    <div style="display:flex;gap:18px;margin-top:14px;font-size:11px;letter-spacing:0.2em;color:var(--ink-dim)">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#ff3b6e;display:inline-block"></span>HOME</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#c77dff;display:inline-block"></span>SELF</span>
    </div>
  </div>`;

  // This-month category split (donut-ish via SVG)
  const tHome = thisM.home, tSelf = thisM.self, tTot = tHome + tSelf || 1;
  const homePct = (tHome / tTot) * 100;
  const selfPct = (tSelf / tTot) * 100;
  html += `<div class="chart-container" style="--accent:#f0c419">
    <div class="chart-title">THIS MONTH · CATEGORY SPLIT</div>
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <svg viewBox="0 0 200 200" style="width:140px;height:140px">
        <circle cx="100" cy="100" r="80" fill="none" stroke="#1a0033" stroke-width="32"/>
        ${donutSegments([
          { value: tHome, color: '#ff3b6e' },
          { value: tSelf, color: '#c77dff' }
        ], 100, 100, 80, 32)}
        <text x="100" y="95" text-anchor="middle" font-family="VT323" font-size="32" fill="#f5e9ff">${fmt(tTot)}</text>
        <text x="100" y="118" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#b39ad8" letter-spacing="2">${sym} TOTAL</text>
      </svg>
      <div style="flex:1;min-width:180px">
        <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">

          <span style="font-family:var(--font-display);font-size:22px;color:#c77dff">${selfPct.toFixed(0)}%</span>
        </div>

  // Quirky verdict
  const verdict = pickSpendingVerdict(thisM, lastM, delta);
  html += `<div class="chart-container" style="border-color:var(--purple)">
    <div class="chart-title" style="color:var(--purple);text-shadow:0 0 4px var(--purple)">PROTOCOL VERDICT</div>
    <div style="font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--ink);line-height:1.4">"${verdict}"</div>
  </div>`;

  return html;
}
function wireSpendingReport(c, f, fmt, sym) { /* no extra wiring needed currently */ }

function donutSegments(items, cx, cy, r, stroke) {
  const total = items.reduce((a, x) => a + x.value, 0);
  if (total <= 0) return '';
  let acc = 0;
  const circ = 2 * Math.PI * r;
  return items.map(it => {
    const frac = it.value / total;
    const dash = circ * frac;
    const gap = circ - dash;
    const offset = -circ * acc;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
}
function pickSpendingVerdict(thisM, lastM, delta) {
  const verdicts = [
    () => thisM.total === 0 ? "Nothing spent this month yet. Either you're a monk, or you forgot to log." : null,
    () => delta > 50 ? "The burn rate doubled. Audit. Now." : null,
    () => delta > 20 ? "Spending is climbing. What changed?" : null,
    () => delta < -20 ? "Genuine discipline. Don't lose the streak." : null,
    () => thisM.self > thisM.home * 2 ? "More on self than home this month. That's not always wrong — just notice it." : null,
    () => thisM.home > thisM.self * 3 ? "Mostly home expenses. Healthy ratio if it's groceries and bills." : null,
    () => "The ledger sees everything. Even the small things you wish it didn't."
  ];
  for (const v of verdicts) { const r = v(); if (r) return r; }
  return "The ledger sees everything.";
}

function workVerdict(weekCat, total) {
  const h = (m) => m / 60;
  if (total === 0) return "No tracked time yet. Run the timer and the truth shows up here.";
  if (weekCat.mails > weekCat.heavy + weekCat.fast) return "Most of the week went to email. That's reactive work, not deep work.";
  if (weekCat.heavy > total * 0.5) return "Over half on deep work. This is what moves cases. Protect it.";
  if (weekCat.fast > total * 0.5) return "Lots of small tasks. Productive-feeling, but did the big rocks move?";
  if (h(total) > 50) return Math.round(h(total)) + " hours logged this week. Heavy. Watch the burnout.";
  return Math.round(h(total)) + " hours tracked. The split looks balanced.";
}

  const today = todayKey();

  let html = `<div class="section">

  </div>`;

  // past entries
  const past = Object.entries(S.journal.entries || {})
    .filter(([d, e]) => d !== today && e.text && e.text.trim())
    .sort((a, b) => b[0].localeCompare(a[0]));

  if (past.length) {
    html += `<div class="section">
      <div class="section-title" style="--accent:#9d4edd">PAST ENTRIES · ${past.length}</div>
      ${past.slice(0, 30).map(([d, e]) => `<div class="journal-entry">

        <div class="je-text">${escapeHtml(e.text)}</div>
        ${e.mood ? `<div class="je-mood">MOOD · ${e.mood}</div>` : ''}
      </div>`).join('')}

    </div>`;
  }

  c.innerHTML = html;

  const ta = document.getElementById('journal-text');
  const status = document.getElementById('journal-status');
  const saveEntry = debounce(async () => {
    const txt = ta.value;
    S.journal.entries[today] = S.journal.entries[today] || {};
    S.journal.entries[today].text = txt;
    S.journal.entries[today].updated = new Date().toISOString();
    await saveState();
    status.textContent = `saved · ${txt.length} chars`;
    renderInsanometer();
  }, 350);
  ta.addEventListener('input', () => {
    status.textContent = 'saving...';
    saveEntry();
  });
  c.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const m = btn.dataset.mood;
      S.journal.entries[today] = S.journal.entries[today] || {};

      S.journal.entries[today].mood = cur === m ? null : m;
      S.journal.entries[today].updated = new Date().toISOString();
      await saveState();
      c.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('active', b.dataset.mood === S.journal.entries[today].mood));
    });
  });
}

      if (!med) return;
      const now = new Date();
      const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      S.bella.givenToday[id] = t;
      S.bella.log.push({ date: todayKey(), medId: id, name: med.name, givenAt: t });
      await saveState();
      renderBella(c);
      renderInsanometer();
      renderTileProgress();
    });
  });
  c.querySelectorAll('[data-undo]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.undo;
      delete S.bella.givenToday[id];
      // remove most recent log entry for this med today
      const today = todayKey();
      for (let i = S.bella.log.length - 1; i >= 0; i--) {
        if (S.bella.log[i].medId === id && S.bella.log[i].date === today) {
          S.bella.log.splice(i, 1); break;
        }
      }
      await saveState();
      renderBella(c);
      renderInsanometer();
      renderTileProgress();
    });
  });
  c.querySelectorAll('[data-dose]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const id = inp.dataset.dose;
      const med = S.bella.meds.find(m => m.id === id);
      if (med) { med.dose = inp.value; await saveState(); }
    });
  });
  document.getElementById('bella-med-add').addEventListener('click', async () => {
    const name = document.getElementById('bella-med-name').value.trim();
    const dose = document.getElementById('bella-med-dose').value.trim();
    const slot = document.getElementById('bella-med-slot').value;
    const notes = document.getElementById('bella-med-notes').value.trim();
    if (!name || !dose) return alert('need name and dose');
    S.bella.meds.push({ id: 'bm_' + uid(), name, dose, slot, notes });
    await saveState();
    renderBella(c);
  });
  document.getElementById('bella-notes').addEventListener('input', debounce(async (e) => {
    S.bella.notes = e.target.value;
    await saveState();
  }, 300));
  document.getElementById('bella-weight').addEventListener('change', async (e) => {
    S.bella.weight = parseFloat(e.target.value) || null;
    await saveState();
  });
}

/* --- DAY OPS · primary module with timeline planner --- */
function renderDayOps(c) {
  if (!S.timeline) S.timeline = { blocks: {} };
  if (!S.timeline.blocks[todayKey()]) S.timeline.blocks[todayKey()] = [];
  const today = todayKey();
  const blocks = S.timeline.blocks[today];

  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const score = calcInsanometerFromState();
  const bedCount = countBeforeSleep();

  // header + reset
  let html = `<div class="section">
    <div class="row between" style="gap:18px;flex-wrap:wrap;margin-bottom:14px">
      <div>
        <div style="font-family:var(--font-display);font-size:72px;color:white;line-height:1;text-shadow:0 0 10px var(--pink),0 0 30px var(--magenta);letter-spacing:0.04em">
          ${hh}<span style="animation:blink 1s steps(2) infinite">:</span>${mm}
        </div>
        <div style="font-size:11px;color:var(--cyan);letter-spacing:0.4em;text-shadow:0 0 4px var(--cyan);margin-top:4px">${formatLong(now).toUpperCase()}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div class="stat" style="--accent:${isSleepDay() ? '#9d4edd' : (score >= 70 ? '#39ff14' : score >= 40 ? '#ffb627' : '#ff3b6e')};min-width:120px">
          <span class="stat-label">INSANOMETER</span>
          <span class="stat-value">${isSleepDay() ? '☾' : score + '%'}</span>
        </div>
        <button class="sleep-pill ${isSleepDay() ? 'on' : ''}" id="sleep-toggle">☾ ${isSleepDay() ? 'REST MODE ON' : 'REST MODE'}</button>
        <button class="btn danger" id="day-reset" style="font-size:11px;padding:12px 18px">⟲ RESET DAY</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);letter-spacing:0.1em;line-height:1.5">drag chips from the palette below onto the timeline · double-tap a chip to add at NOW · tap a block to edit (or long-press on mobile) · drag a block's right edge to resize · REST MODE pauses all judgment for recovery days</div>
  </div>`;

  // BEFORE SLEEP list
  const bedItems = getBeforeSleepItems();
  html += `<div class="section">
    <div class="section-title" style="--accent:#ff10a8">BEFORE SLEEP · ${bedItems.length === 0 ? 'CLEAR ✓' : bedItems.length + ' PENDING'}</div>
    ${bedItems.length === 0
      ? `<div class="card" style="border-left:3px solid var(--green);background:rgba(57,255,20,0.06)">
          <div style="font-family:var(--font-display);font-size:32px;color:var(--green);text-align:center;text-shadow:0 0 6px var(--green);letter-spacing:0.1em">ALL CLEAR · GO TO SLEEP</div>
        </div>`
      : `<div class="bedlist">
        ${bedItems.map(it => `<div class="bedlist-item" style="--accent:${it.color}" onclick="window.__openModule('${it.module}')">
          <span>${escapeHtml(it.text)}</span>
          <span class="bl-tag">${it.module}</span>
        </div>`).join('')}
      </div>`
    }
  </div>`;

  // TIMELINE strip
  const startHour = Math.max(0, now.getHours() - 2);
  const endHour = Math.min(24, now.getHours() + 6);
  const hourList = [];
  for (let h = 0; h < 24; h++) hourList.push(h);
  const HOUR_WIDTH = 120;

  html += `<div class="section">
    <div class="section-title" style="--accent:#00f0ff">TIMELINE · ${blocks.length} BLOCKS · ${blocks.filter(b=>b.done).length} DONE</div>
    <div class="timeline-wrap">
      <div class="timeline-strip" id="tl-strip">
        <div class="timeline-track" id="tl-track" style="width:${24 * HOUR_WIDTH}px">
          <div class="now-indicator" id="now-indicator" style="left:${(now.getHours() + now.getMinutes()/60) * HOUR_WIDTH}px"></div>
          ${hourList.map(h => {
            const isCurrent = h === now.getHours();
            const isPast = h < now.getHours();
            const label = (h % 12 || 12) + (h < 12 ? ' AM' : ' PM');
            return `<div class="timeline-hour ${isCurrent ? 'current' : ''} ${isPast ? 'past' : ''}" data-hour="${h}" data-label="${label}">
              <div class="quarter" data-q="0"></div><div class="quarter" data-q="1"></div><div class="quarter" data-q="2"></div><div class="quarter" data-q="3"></div>
            </div>`;
          }).join('')}
          ${blocks.map(b => {
            const left = (b.hour + (b.minute || 0)/60) * HOUR_WIDTH;
            const w = ((b.duration || 30) / 60) * HOUR_WIDTH - 4;
            return `<div class="timeline-item ${b.done ? 'done' : ''}" data-bid="${b.id}" style="left:${left + 2}px;width:${Math.max(40, w)}px;--accent:${b.color || '#ff10a8'};--accent-glow:${b.glow || 'rgba(255,16,168,0.5)'};background:${b.color || '#ff10a8'};color:${getContrastInk(b.color || '#ff10a8')}" draggable="true" title="${escapeHtml(b.label + (b.note ? ' · ' + b.note : ''))}">
              <div class="ti-time">${String(b.hour).padStart(2,'0')}:${String(b.minute || 0).padStart(2,'0')}</div>
              <div class="ti-label">${escapeHtml(b.label)}</div>
              ${b.note ? `<div class="ti-note">${escapeHtml(b.note)}</div>` : ''}
              <div class="ti-resize" data-resize="${b.id}"></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>`;

  // PALETTE
  const chips = getPaletteChips();
  html += `<div class="section">
    <div class="section-title" style="--accent:#5cf5ff">PALETTE · DRAG ONTO TIMELINE</div>
    <div class="palette" id="palette">
      ${chips.map(ch => `<div class="palette-chip" draggable="true" data-chip='${JSON.stringify(ch).replace(/'/g, "&#39;")}' style="--accent:${ch.color}">
        <span class="chip-icon">${ch.icon}</span>
        <span>${escapeHtml(ch.label)}</span>
      </div>`).join('')}
      <button class="palette-chip" id="custom-chip" style="--accent:#5cf5ff;background:transparent" title="add custom">
        <span class="chip-icon">+</span>
        <span>CUSTOM</span>
      </button>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);letter-spacing:0.1em;margin-top:6px">double-click a chip to drop at NOW · drag to drop at a specific time</div>
  </div>`;

  c.innerHTML = html;

  // reset day
  document.getElementById('day-reset').addEventListener('click', () => window.resetDayConfirm());
  // sleep mode toggle
  const sleepBtn = document.getElementById('sleep-toggle');
  if (sleepBtn) sleepBtn.addEventListener('click', async () => {
    const on = await toggleSleepMode();
    showToast(on ? 'rest mode on · no judgment today' : 'rest mode off');
    renderDayOps(c);
  });

  // auto-scroll timeline to NOW
  const strip = document.getElementById('tl-strip');
  const scrollTo = (now.getHours() + now.getMinutes()/60) * HOUR_WIDTH - strip.clientWidth / 2 + 60;
  strip.scrollLeft = Math.max(0, scrollTo);

  // === Drag/drop wiring ===
  let dragData = null;

  // palette chips → drag start
  c.querySelectorAll('.palette-chip[data-chip]').forEach(chip => {
    chip.addEventListener('dragstart', (e) => {
      dragData = JSON.parse(chip.dataset.chip);
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', 'chip');
    });
    chip.addEventListener('dragend', () => { chip.classList.remove('dragging'); dragData = null; });
    chip.addEventListener('dblclick', async () => {
      const chipData = JSON.parse(chip.dataset.chip);
      const note = prompt('note for this block (optional):') || '';
      const dur = parseInt(prompt('duration in minutes (default 30):') || '30') || 30;
      const nowD = new Date();
      addTimelineBlock({
        hour: nowD.getHours(),
        minute: nowD.getMinutes(),
        label: chipData.label,
        moduleId: chipData.moduleId,
        color: chipData.color,
        glow: chipData.glow,
        note, duration: dur, done: false
      });
      await saveState(); renderDayOps(c);
    });
  });

  // custom chip
  document.getElementById('custom-chip').addEventListener('click', async () => {
    const label = prompt('Custom block label:');
    if (!label) return;
    const note = prompt('Note (optional):') || '';
    const dur = parseInt(prompt('Duration in minutes:') || '30') || 30;
    const nowD = new Date();
    addTimelineBlock({
      hour: nowD.getHours(), minute: nowD.getMinutes(),
      label, moduleId: 'custom',
      color: '#5cf5ff', glow: 'rgba(92,245,255,0.5)',
      note, duration: dur, done: false
    });
    await saveState(); renderDayOps(c);
  });

  // timeline hours → drop target
  c.querySelectorAll('.timeline-hour').forEach(hourEl => {
    hourEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      hourEl.classList.add('dragover');
    });
    hourEl.addEventListener('dragleave', () => hourEl.classList.remove('dragover'));
    hourEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      hourEl.classList.remove('dragover');
      if (!dragData) return;
      const hr = parseInt(hourEl.dataset.hour);
      const rect = hourEl.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const minute = Math.floor((offsetX / rect.width) * 60 / 5) * 5; // snap to 5min
      const note = prompt('Note for this block (optional):') || '';
      const dur = parseInt(prompt('Duration in minutes (default 30):') || '30') || 30;
      addTimelineBlock({
        hour: hr, minute, label: dragData.label, moduleId: dragData.moduleId,
        color: dragData.color, glow: dragData.glow,
        note, duration: dur, done: false
      });
      dragData = null;
      await saveState();
      renderDayOps(c);
    });
  });

  // timeline items → click/long-press to edit (popover), drag to reposition, handle to resize
  const HOUR_W = HOUR_WIDTH;
  c.querySelectorAll('.timeline-item').forEach(item => {
    const bid = item.dataset.bid;
    let longPressTimer = null;
    let didLongPress = false;
    let resizing = false;

    // resize handle
    const handle = item.querySelector('.ti-resize');
    if (handle) {
      const startResize = (clientX) => {
        resizing = true;
        item.classList.add('resizing');
        const b = blocks.find(x => x.id === bid);
        const startX = clientX;
        const startDur = b.duration || 30;
        const move = (mx) => {
          const deltaMin = ((mx - startX) / HOUR_W) * 60;
          let newDur = Math.max(5, Math.round((startDur + deltaMin) / 5) * 5);
          b.duration = newDur;
          item.style.width = Math.max(40, (newDur / 60) * HOUR_W - 4) + 'px';
        };
        const onMouseMove = (e) => move(e.clientX);
        const onTouchMove = (e) => { if (e.touches[0]) move(e.touches[0].clientX); };
        const end = async () => {
          resizing = false;
          item.classList.remove('resizing');
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', end);
          document.removeEventListener('touchmove', onTouchMove);
          document.removeEventListener('touchend', end);
          await saveState();
          renderInsanometer();
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', end);
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', end);
      };
      handle.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); startResize(e.clientX); });
      handle.addEventListener('touchstart', (e) => { e.stopPropagation(); if (e.touches[0]) startResize(e.touches[0].clientX); }, { passive: true });
    }

    // click → popover (desktop)
    item.addEventListener('click', (e) => {
      if (resizing || didLongPress) { didLongPress = false; return; }
      if (e.target.classList.contains('ti-resize')) return;
      openBlockPopover(bid, c, e.clientX, e.clientY);
    });

    // long-press → popover (touch)
    item.addEventListener('touchstart', (e) => {
      didLongPress = false;
      longPressTimer = setTimeout(() => {
        didLongPress = true;
        const t = e.touches[0];
        openBlockPopover(bid, c, t ? t.clientX : 100, t ? t.clientY : 100);
        if (navigator.vibrate) navigator.vibrate(30);
      }, 480);
    }, { passive: true });
    item.addEventListener('touchend', () => clearTimeout(longPressTimer));
    item.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });

    // drag to reposition (desktop)
    item.addEventListener('dragstart', (e) => {
      if (resizing) { e.preventDefault(); return; }
      dragData = { reposition: true, blockId: bid };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'reposition');
    });
    item.addEventListener('dragend', () => { dragData = null; });
  });
}

/* timeline block edit popover */
function openBlockPopover(bid, c, x, y) {
  const today = todayKey();
  const blocks = S.timeline.blocks[today] || [];
  const b = blocks.find(x => x.id === bid);
  if (!b) return;
  closeBlockPopover();

  const backdrop = document.createElement('div');
  backdrop.className = 'tl-popover-backdrop';
  backdrop.id = 'tl-pop-backdrop';
  backdrop.addEventListener('click', closeBlockPopover);
  document.body.appendChild(backdrop);

  const pop = document.createElement('div');
  pop.className = 'tl-popover';
  pop.id = 'tl-pop';
  pop.innerHTML = `
    <h4>${escapeHtml(b.label)}</h4>
    <div class="tlp-row">
      <div class="tlp-label">NOTE</div>
      <input type="text" class="field" id="pop-note" value="${escapeHtml(b.note || '')}" placeholder="what / where / how">
    </div>
    <div class="tlp-row" style="display:flex;gap:10px">
      <div style="flex:1">
        <div class="tlp-label">TIME</div>
        <input type="time" class="field" id="pop-time" value="${String(b.hour).padStart(2,'0')}:${String(b.minute||0).padStart(2,'0')}">
      </div>
      <div style="flex:1">
        <div class="tlp-label">MINUTES</div>
        <input type="number" class="field" id="pop-dur" value="${b.duration || 30}" min="5" step="5">
      </div>
    </div>
    <div class="tlp-actions">
      <button class="btn ${b.done ? 'cyan' : ''}" id="pop-done" style="flex:1">${b.done ? '↺ UNDO' : '✓ DONE'}</button>
      <button class="btn danger" id="pop-del">DELETE</button>
    </div>
    <button class="btn ghost" id="pop-close" style="width:100%;margin-top:8px">CLOSE</button>
  `;
  document.body.appendChild(pop);

  // position near tap, clamped to viewport
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let px = Math.min(Math.max(10, x - pw/2), window.innerWidth - pw - 10);
  let py = Math.min(Math.max(10, y + 14), window.innerHeight - ph - 10);
  pop.style.left = px + 'px';
  pop.style.top = py + 'px';

  const save = async (rerender) => {
    b.note = document.getElementById('pop-note').value;
    const tv = document.getElementById('pop-time').value;
    if (tv && /^\d{1,2}:\d{2}$/.test(tv)) { const [h, m] = tv.split(':').map(Number); b.hour = h; b.minute = m; }
    const dv = parseInt(document.getElementById('pop-dur').value);
    if (!isNaN(dv) && dv >= 5) b.duration = dv;
    await saveState();
    if (rerender) { closeBlockPopover(); renderDayOps(c); renderInsanometer(); }
  };
  document.getElementById('pop-done').addEventListener('click', async () => {
    await save(false);
    b.done = !b.done;
    await saveState();
    closeBlockPopover(); renderDayOps(c); renderInsanometer();
  });
  document.getElementById('pop-del').addEventListener('click', async () => {
    if (!confirm('Delete this block?')) return;
    S.timeline.blocks[today] = blocks.filter(x => x.id !== bid);
    await saveState();
    closeBlockPopover(); renderDayOps(c); renderInsanometer();
  });
  document.getElementById('pop-close').addEventListener('click', () => save(true));
  document.getElementById('pop-note').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(true); });
}
function closeBlockPopover() {
  const p = document.getElementById('tl-pop'); if (p) p.remove();
  const bd = document.getElementById('tl-pop-backdrop'); if (bd) bd.remove();
}

function addTimelineBlock(b) {
  if (!S.timeline) S.timeline = { blocks: {} };
  const k = todayKey();
  if (!S.timeline.blocks[k]) S.timeline.blocks[k] = [];
  S.timeline.blocks[k].push({ id: uid(), ...b });
}

function getBeforeSleepItems() {
  const items = [];
  const now = new Date();
  const hm = now.getHours() * 60 + now.getMinutes();
  const starts = { fajr: 0, dhuhr: 12*60, asr: 15*60, maghrib: 18*60, isha: 20*60 };
  const prayerLabels = { fajr: 'Pray Fajr', dhuhr: 'Pray Dhuhr', asr: 'Pray Asr', maghrib: 'Pray Maghrib', isha: 'Pray Isha' };
  for (const [p, start] of Object.entries(starts)) {
    if (hm >= start && !S.deen.prayers[p] && S.deen.voidReason !== p) {
      items.push({ module: 'DEEN', text: prayerLabels[p], color: '#ffb627' });
    }
  }
  // pills
  S.wellness.phases.forEach(phase => {
    phase.items.forEach((item, idx) => {
      const key = `${phase.id}-${idx}`;
      if (!S.wellness.pillsChecked[key]) {
        items.push({ module: 'WELLNESS', text: `${item} (${phase.time})`, color: '#39ff14' });
      }
    });
  });
  // walking
  if ((S.wellness.walking.steps || 0) < S.wellness.walking.target) {
    const left = S.wellness.walking.target - (S.wellness.walking.steps || 0);
    items.push({ module: 'WELLNESS', text: `Walk ${left.toLocaleString()} more steps`, color: '#39ff14' });
  }
  // bella meds
  if (S.bella && S.bella.meds) {
    S.bella.meds.forEach(med => {
      if (!S.bella.givenToday || !S.bella.givenToday[med.id]) {
        items.push({ module: 'BELLA', text: `Bella: ${med.name} (${med.dose})`, color: '#ffb627' });
      }
    });
  }
  // work open tasks (top 5 only)
  const wkTasks = S.work && S.work.tasks ? S.work.tasks.filter(t => !t.done) : (S.work.todos || []).filter(t => !t.done);
  wkTasks.slice(0, 5).forEach(t => items.push({ module: 'WORK', text: `Work: ${t.text}`, color: '#ff10a8' }));
  if (wkTasks.length > 5) items.push({ module: 'WORK', text: `+ ${wkTasks.length - 5} more work tasks`, color: '#ff10a8' });
  // studying
  if (!S.studying.studiedToday) items.push({ module: 'MLEA', text: 'Sit down and study (any amount)', color: '#00f0ff' });
  S.studying.todos.filter(t => !t.done).slice(0, 3).forEach(t => items.push({ module: 'MLEA', text: 'MLEA: ' + t.text, color: '#00f0ff' }));
  // journal
  const j = S.journal && S.journal.entries[todayKey()];
  if (!j || !j.text || !j.text.trim()) items.push({ module: 'JOURNAL', text: 'Write today\'s entry', color: '#9d4edd' });
  // mystery
  if (S.mystery.task && !S.mystery.task.done) items.push({ module: 'MYSTERY', text: 'Mystery: ' + S.mystery.task.text.slice(0, 40) + (S.mystery.task.text.length > 40 ? '...' : ''), color: '#c77dff' });
  return items;
}

function getPaletteChips() {
  const chips = [];
  // prayers
  ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(p => {
    chips.push({ moduleId: 'deen', label: p, icon: '☪', color: '#ffb627', glow: 'rgba(255,182,39,0.5)' });
  });
  // wellness chips
  chips.push({ moduleId: 'wellness', label: 'Pills · phase', icon: '✚', color: '#39ff14', glow: 'rgba(57,255,20,0.5)' });
  chips.push({ moduleId: 'wellness', label: 'Walk', icon: '→', color: '#39ff14', glow: 'rgba(57,255,20,0.5)' });
  // work chips
  chips.push({ moduleId: 'work', label: 'Mails block', icon: '✉', color: '#5cf5ff', glow: 'rgba(92,245,255,0.5)' });
  chips.push({ moduleId: 'work', label: 'Deep work', icon: '◈', color: '#ff3b6e', glow: 'rgba(255,59,110,0.5)' });
  chips.push({ moduleId: 'work', label: 'Quick task', icon: '→', color: '#39ff14', glow: 'rgba(57,255,20,0.5)' });
  // studying
  chips.push({ moduleId: 'studying', label: 'Study session', icon: '§', color: '#00f0ff', glow: 'rgba(0,240,255,0.5)' });
  // bella
  if (S.bella && S.bella.meds && S.bella.meds.length) {
    chips.push({ moduleId: 'bella', label: 'Bella meds', icon: '♥', color: '#ffb627', glow: 'rgba(255,182,39,0.5)' });
    chips.push({ moduleId: 'bella', label: 'Bella walk', icon: '♥', color: '#ff8fc4', glow: 'rgba(255,143,196,0.5)' });
  }
  // journal

  // life

  chips.push({ moduleId: 'custom', label: 'Rest', icon: '◌', color: '#5cf5ff', glow: 'rgba(92,245,255,0.5)' });

  return chips;
}

function getContrastInk(hex) {
  // approximate brightness check
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 140 ? '#0a001a' : '#f5e9ff';
}

/* --- Heatmap render (60 days, last column = today) --- */
function renderHeatmap(modKey) {
  const days = 60;
  const cells = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    let level = -1; let isVoid = false;
    if (k === todayKey()) {
      // live score
      if (modKey === 'overall') level = scoreToLevel(calcInsanometerFromState() / 100);
      else {
        const scores = computeModuleScores();
        level = scoreToLevel(scores[modKey] || 0);
        if (modKey === 'deen' && scores.deenVoid) isVoid = true;
      }
    } else {
      const h = (S.history || {})[k];
      if (h) {
        if (modKey === 'overall') level = scoreToLevel((h.insanometer || 0) / 100);
        else if (h.scores) {
          level = scoreToLevel(h.scores[modKey] || 0);
          if (modKey === 'deen' && h.scores.deenVoid) isVoid = true;
        }
      }
    }
    cells.push({ k, level, isVoid, label: k });
  }
  return `<div class="heatmap" title="last 60 days">
    ${cells.map(c => `<div class="heatmap-cell ${c.isVoid ? 'void' : c.level >= 0 ? 'l' + c.level : ''}" title="${c.label}"></div>`).join('')}
  </div>
  <div class="heatmap-legend">
    <span>LESS</span>
    <span class="leg-cell" style="background:rgba(255,16,168,0.12)"></span>
    <span class="leg-cell" style="background:rgba(255,16,168,0.3)"></span>
    <span class="leg-cell" style="background:rgba(255,16,168,0.5)"></span>
    <span class="leg-cell" style="background:rgba(255,16,168,0.75)"></span>
    <span class="leg-cell" style="background:var(--pink)"></span>
    <span>MORE</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:4px"><span class="leg-cell" style="background:var(--void)"></span>VOID</span>
  </div>`;
}
function scoreToLevel(score) {
  if (score <= 0) return -1; // shown as blank cell
  if (score < 0.25) return 0;
  if (score < 0.5)  return 1;
  if (score < 0.75) return 2;
  if (score < 0.95) return 3;
  return 4;
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const obj = JSON.parse(r.result);
      if (!obj || typeof obj !== 'object' || obj.version !== 1) { alert('not a valid v1 export'); return; }
      if (!confirm('Replace ALL current data with the imported file? This cannot be undone.')) return;
      S = obj;
      await saveState();
      applyTheme();
      renderGrid(); renderInsanometer(); renderStreakBanner(); renderSettings();
      alert('Imported.');
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  r.readAsText(file);
  e.target.value = '';
}

/* --- Aladhan prayer times fetch --- */
async function fetchPrayerTimes(force) {
  if (!S.settings || !S.settings.autoPrayerTimes) return false;
  if (!force && S.prayerCache && S.prayerCache.date === todayKey()) {
    applyPrayerTimings(S.prayerCache.timings);
    return true;
  }
  const loc = S.settings.location || {};
  const method = S.settings.prayerMethod || 5;
  let url;
  if (loc.lat != null && loc.lng != null) {
    url = `https://api.aladhan.com/v1/timings/${todayKey()}?latitude=${loc.lat}&longitude=${loc.lng}&method=${method}`;
  } else {
    const city = encodeURIComponent(loc.city || 'Tanta');
    const country = encodeURIComponent(loc.country || 'Egypt');
    url = `https://api.aladhan.com/v1/timingsByCity/${todayKey()}?city=${city}&country=${country}&method=${method}`;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) return false;
    const data = await res.json();
    if (data.code !== 200 || !data.data || !data.data.timings) return false;
    const t = data.data.timings;
    const cleanTimings = {
      fajr:    cleanTime(t.Fajr),
      dhuhr:   cleanTime(t.Dhuhr),
      asr:     cleanTime(t.Asr),
      maghrib: cleanTime(t.Maghrib),
      isha:    cleanTime(t.Isha)
    };
    S.prayerCache = { date: todayKey(), timings: cleanTimings };
    applyPrayerTimings(cleanTimings);
    await saveState();
    return true;
  } catch (err) {
    console.warn('Prayer time fetch failed:', err);
    return false;
  }
}
function cleanTime(s) { return (s || '').split(' ')[0]; }
function applyPrayerTimings(t) {
  // Use the prayer start times to build "deadlines" — deadline for prayer X = start of prayer X+1, except isha = 23:59
  if (!t) return;
  // store actual adhan start times
  S.deen.times = {
    fajr: t.fajr, dhuhr: t.dhuhr, asr: t.asr, maghrib: t.maghrib, isha: t.isha
  };
  S.deen.deadlines.fajr = subMinutes(t.dhuhr, 1) || t.dhuhr;     // until before dhuhr
  S.deen.deadlines.dhuhr = subMinutes(t.asr, 1) || t.asr;
  S.deen.deadlines.asr = subMinutes(t.maghrib, 1) || t.maghrib;
  S.deen.deadlines.maghrib = subMinutes(t.isha, 1) || t.isha;
  S.deen.deadlines.isha = '23:59';
}
function subMinutes(hhmm, m) {
  if (!hhmm) return null;
  const [h, mm] = hhmm.split(':').map(Number);
  if (isNaN(h) || isNaN(mm)) return null;
  let total = h * 60 + mm - m;
  if (total < 0) total += 24 * 60;
  const nh = Math.floor(total / 60), nm = total % 60;
  return String(nh).padStart(2,'0') + ':' + String(nm).padStart(2,'0');
}

/* --- SyncEngine: multi-device sync via JSONBin or custom endpoint --- */
const SyncEngine = {
  pushTimer: null,
  syncing: false,

  cfg() { return (S.settings && S.settings.sync) || {}; },

  deviceId() {
    if (!S.syncMeta) S.syncMeta = {};
    if (!S.syncMeta.device) S.syncMeta.device = 'dev_' + Math.random().toString(36).slice(2, 8);
    return S.syncMeta.device;
  },

  queuePush() {
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push().catch(() => {}), 2500);
  },

  setStatus(msg, color) {
    const el = document.getElementById('sync-status');
    if (el) { el.textContent = msg; el.style.color = color || 'var(--ink-faint)'; }
  },

  // Ensure a JSONBin exists; create one if needed. Returns bin id or null.
  async ensureBin() {
    const c = this.cfg();
    if (c.binId) return c.binId;
    if (!c.apiKey) return null;
    try {
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': c.apiKey,
          'X-Bin-Name': 'insanometer-sync',
          'X-Bin-Private': 'true'
        },
        body: JSON.stringify({ state: S, updatedAt: S.syncMeta.updatedAt })
      });
      if (!res.ok) return null;
      const data = await res.json();
      const id = data.metadata && data.metadata.id;
      if (id) { S.settings.sync.binId = id; await Store.setJSON(STATE_KEY, S); }
      return id;
    } catch { return null; }
  },

  async push() {
    const c = this.cfg();
    if (!c.enabled || this.syncing) return false;
    this.syncing = true;
    this.setStatus('pushing…', 'var(--cyan)');
    try {
      let ok = false;
      if (c.provider === 'jsonbin') {
        const bin = await this.ensureBin();
        if (!bin) { this.setStatus('✕ no bin/key', 'var(--red)'); return false; }
        const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': c.apiKey },
          body: JSON.stringify({ state: S, updatedAt: S.syncMeta.updatedAt })
        });
        ok = res.ok;
      } else if (c.provider === 'custom' && c.url) {
        const headers = { 'Content-Type': 'application/json' };
        if (c.token) headers['Authorization'] = 'Bearer ' + c.token;
        const res = await fetch(c.url, { method: 'PUT', headers, body: JSON.stringify({ state: S, updatedAt: S.syncMeta.updatedAt }) });
        ok = res.ok;
      }
      if (ok) {
        S.settings.sync.lastSync = new Date().toISOString();
        await Store.setJSON(STATE_KEY, S);
        this.setStatus('✓ synced ' + new Date().toLocaleTimeString(), 'var(--green)');
      } else {
        this.setStatus('✕ push failed', 'var(--red)');
      }
      return ok;
    } catch (e) {
      this.setStatus('✕ ' + e.message, 'var(--red)');
      return false;
    } finally { this.syncing = false; }
  },

  async pull() {
    const c = this.cfg();
    if (!c.enabled) return null;
    try {
      let payload = null;
      if (c.provider === 'jsonbin') {
        if (!c.binId || !c.apiKey) return null;
        const res = await fetch(`https://api.jsonbin.io/v3/b/${c.binId}/latest`, {
          headers: { 'X-Master-Key': c.apiKey }
        });
        if (!res.ok) return null;
        const data = await res.json();
        payload = data.record;
      } else if (c.provider === 'custom' && c.url) {
        const headers = {};
        if (c.token) headers['Authorization'] = 'Bearer ' + c.token;
        const res = await fetch(c.url, { headers });
        if (!res.ok) return null;
        payload = await res.json();
      }
      if (payload && payload.state) return payload;
      return null;
    } catch { return null; }
  },

  // Pull remote, compare timestamps, adopt newer. Returns 'pulled' | 'pushed' | 'insync' | 'error'
  async sync(silent) {
    const c = this.cfg();
    if (!c.enabled) return 'off';
    if (!silent) this.setStatus('syncing…', 'var(--cyan)');
    const remote = await this.pull();
    if (remote === null) {
      // nothing remote yet — push ours
      const ok = await this.push();
      return ok ? 'pushed' : 'error';
    }
    const remoteTime = new Date(remote.updatedAt || 0).getTime();
    const localTime = new Date(S.syncMeta.updatedAt || 0).getTime();
    if (remoteTime > localTime) {
      // adopt remote
      const dev = this.deviceId();
      S = remote.state;
      if (!S.syncMeta) S.syncMeta = {};
      S.syncMeta.device = dev;
      await Store.setJSON(STATE_KEY, S);
      // re-run day rollover if needed
      if (S.today !== todayKey()) await rolloverDay();
      applyTheme();
      renderGrid(); renderInsanometer(); renderStreakBanner();
      if (document.getElementById('settings').classList.contains('open')) renderSettings();
      this.setStatus('✓ pulled remote ' + new Date().toLocaleTimeString(), 'var(--green)');
      return 'pulled';
    } else if (localTime > remoteTime) {
      const ok = await this.push();
      return ok ? 'pushed' : 'error';
    }
    this.setStatus('✓ in sync', 'var(--green)');
    return 'insync';
  }
};

/* --- iOS Shortcuts step import: read ?steps= or ?bella= from URL on boot --- */
async function handleUrlImport() {
  const params = new URLSearchParams(window.location.search);
  let changed = false;
  let msg = [];
  if (params.has('steps')) {
    const steps = parseInt(params.get('steps'));
    if (!isNaN(steps) && steps >= 0) {
      S.wellness.walking.steps = steps;
      changed = true;
      msg.push(steps.toLocaleString() + ' steps imported');
    }
  }
  // optional: ?prayer=fajr marks a prayer done (for a shortcut/automation)
  if (params.has('prayer')) {
    const p = params.get('prayer').toLowerCase();
    if (S.deen.prayers[p] !== undefined) { S.deen.prayers[p] = true; changed = true; msg.push(p + ' marked'); }
  }
  if (changed) {
    await saveState();
    // clean the URL so a refresh doesn't re-import
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    showToast(msg.join(' · '));
  }
}

/* --- tiny toast --- */
function showToast(text) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:600;background:rgba(10,0,26,0.95);border:1px solid var(--green);color:var(--green);padding:12px 22px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;border-radius:4px;box-shadow:0 0 16px rgba(57,255,20,0.4);backdrop-filter:blur(8px);text-transform:uppercase;transition:opacity 0.3s;';
    document.body.appendChild(t);
  }
  t.textContent = text;
  t.style.opacity = '1';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

/* --- Sleep mode helpers --- */
function isSleepDay(date) {
  return !!(S.sleepDays && S.sleepDays[date || todayKey()]);
}
async function toggleSleepMode() {
  if (!S.sleepDays) S.sleepDays = {};
  const k = todayKey();
  if (S.sleepDays[k]) delete S.sleepDays[k];
  else S.sleepDays[k] = true;
  await saveState();
  renderInsanometer();
  renderGrid();
  return isSleepDay();
}

/* --- AudioEngine: ambient drone via Web Audio --- */
const AudioEngine = {
  ctx: null, master: null, oscs: [], filter: null, lfo: null, lfoGain: null,
  started: false,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain();
    this.master.gain.value = (S.settings && S.settings.audioVolume) || 0.15;
    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.frequency.value = 600;
    this.filter.Q.value = 4;
    this.filter.connect(this.master);
    this.master.connect(this.ctx.destination);
    // 3 detuned oscillators around A2 (110hz)
    [110, 110.6, 165, 220.2].forEach(f => {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f;
      const g = this.ctx.createGain(); g.gain.value = 0.18;
      o.connect(g); g.connect(this.filter);
      this.oscs.push({ o, g });
    });
    // slow LFO on filter cutoff for movement
    this.lfo = this.ctx.createOscillator(); this.lfo.frequency.value = 0.07;
    this.lfoGain = this.ctx.createGain(); this.lfoGain.gain.value = 240;
    this.lfo.connect(this.lfoGain); this.lfoGain.connect(this.filter.frequency);
  },
  start() {
    this.init();
    if (!this.ctx || this.started) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.oscs.forEach(({ o }) => { try { o.start(); } catch {} });
    try { this.lfo.start(); } catch {}
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setValueAtTime(0, this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime((S.settings && S.settings.audioVolume) || 0.15, this.ctx.currentTime + 1.5);
    this.started = true;
  },
  stop() {
    if (!this.ctx || !this.started) return;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.6);
  },
  setVolume(v) {
    if (this.master && this.ctx) {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(v, this.ctx.currentTime + 0.2);
    }
  }
};

/* --- Screensaver --- */
const Screensaver = {
  timer: null, lastActivity: Date.now(), active: false,
  arm() {
    this.bump();
    ['mousemove','keydown','touchstart','scroll','click'].forEach(ev => {
      window.addEventListener(ev, () => {
        if (this.active) this.dismiss();
        this.bump();
      }, { passive: true });
    });
    setInterval(() => {
      if (!S.settings || !S.settings.screensaverEnabled) return;
      const idle = (Date.now() - this.lastActivity) / 60000;
      if (idle >= S.settings.screensaverMinutes && !this.active) this.show();
    }, 5000);
  },
  bump() { this.lastActivity = Date.now(); },
  show() {
    this.active = true;
    document.getElementById('screensaver').classList.add('active');
    this.tick(); this.timer = setInterval(() => this.tick(), 1000);
  },
  tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('ss-time').textContent = hh + ':' + mm;
    document.getElementById('ss-date').textContent = formatLong(now).toUpperCase();
  },
  dismiss() {
    this.active = false;
    clearInterval(this.timer);
    document.getElementById('screensaver').classList.remove('active');
  }
};

/* ============ generic item row + wiring ============ */
function itemRowHtml(it, ns) {
  return `<div class="check-row ${it.done ? 'done' : ''}" data-ns="${ns}" data-id="${it.id}">
    <input type="checkbox" ${it.done ? 'checked' : ''}>
    <label>${escapeHtml(it.text)}</label>
    ${it.due ? `<span style="font-size:10px;color:var(--ink-faint);letter-spacing:0.2em">DUE ${it.due}</span>` : ''}
    <span class="del" title="delete">×</span>
  </div>`;
}
function wireItemList(root, selector, list, ns) {
  const container = root.querySelector(selector);
  if (!container) return;
  container.querySelectorAll(`.check-row[data-ns="${ns}"]`).forEach(row => {
    const id = row.dataset.id;
    const it = list.find(x => x.id === id);
    if (!it) return;
    row.querySelector('input[type=checkbox]').addEventListener('change', async (e) => {
      it.done = e.target.checked;
      row.classList.toggle('done', it.done);
      await saveState();
      renderInsanometer();
    });
    row.querySelector('.del').addEventListener('click', async () => {
      const idx = list.findIndex(x => x.id === id);
      if (idx >= 0) list.splice(idx, 1);
      row.remove();
      await saveState();
      renderInsanometer();
    });
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ============ HERO SYNTHWAVE SCENE ============ */
const HERO = {
  paletteSky: ['#1a0033','#3b0d4d','#6b1b6e','#a91e7a','#d63384','#ff5a87','#ff7a5c'],
  gridA: '#ff10f0', gridB: '#00f0ff',
  dark: '#0a001a',

  init() {
    // sky bands
    const sb = document.getElementById('sky-bands');
    const h = [0.13, 0.10, 0.08, 0.07, 0.06, 0.03, 0.03]; // proportions of 50vh
    let top = 0;
    this.paletteSky.forEach((c, i) => {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute;left:0;right:0;top:${(top*100).toFixed(1)}vh;height:${(h[i]*100).toFixed(1)}vh;background:${c};`;
      sb.appendChild(d);
      top += h[i];
    });
    // stars
    const sl = document.getElementById('stars-layer');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star' + (Math.random() > 0.83 ? ' big' : '');
      s.style.left = (Math.random()*100) + '%';
      s.style.top = (Math.random()*55) + '%';
      s.style.opacity = (0.4 + Math.random()*0.6).toFixed(2);
      s.style.animationDelay = (Math.random()*3) + 's';
      s.dataset.par = (0.3 + Math.random()*0.7).toFixed(2);
      sl.appendChild(s);
    }
    // canvas
    this.canvas = document.getElementById('grid-canvas');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.gOff = 0; this.last = performance.now();
    requestAnimationFrame(this.tick.bind(this));

    // parallax
    document.getElementById('hero').addEventListener('mousemove', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const mx = (e.clientX - r.left)/r.width - 0.5;
      const my = (e.clientY - r.top)/r.height - 0.5;
      sl.querySelectorAll('.star').forEach(s => {
        const f = parseFloat(s.dataset.par);
        s.style.transform = `translate(${mx * f * 20}px,${my * f * 10}px)`;
      });
      document.getElementById('sun').style.transform = `translateX(-50%) translate(${mx * -10}px,${my * -5}px)`;
    });
  },
  resize() {
    const c = this.canvas;
    c.width = window.innerWidth;
    c.height = window.innerHeight * 0.5;
    this.ctx = c.getContext('2d');
  },
  tick(now) {
    const dt = now - this.last;
    this.gOff += dt * 0.0009;
    this.draw();
    this.last = now;
    requestAnimationFrame(this.tick.bind(this));
  },
  draw() {
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;
    ctx.clearRect(0, 0, W, H);
    const vx = W/2;
    ctx.lineWidth = 1;
    ctx.strokeStyle = this.gridA;
    ctx.shadowBlur = 8; ctx.shadowColor = this.gridA;
    const numV = 25;
    for (let i = 0; i < numV; i++) {
      const t = (i - (numV-1)/2) / ((numV-1)/2);
      const bx = vx + t * W * 2.5;
      ctx.beginPath(); ctx.moveTo(vx, 0); ctx.lineTo(bx, H); ctx.stroke();
    }
    ctx.strokeStyle = this.gridB; ctx.shadowColor = this.gridB;
    const numH = 16;
    for (let i = 0; i < numH; i++) {
      let t = ((i + (this.gOff % 1)) / numH);
      t = Math.pow(t, 2.4);
      const y = t * H;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
};

/* ============ SCROLL HANDLER (blur hero) ============ */
function onScroll() {
  const y = window.scrollY;
  const vh = window.innerHeight;
  const ratio = Math.min(1, y / (vh * 0.6));
  const hero = document.getElementById('hero');
  hero.style.filter = `blur(${ratio * 18}px)`;
  hero.style.opacity = (1 - ratio * 0.35).toFixed(2);
  // hide scroll hint after a tiny scroll
  const hint = document.getElementById('scroll-hint');
  if (hint) hint.style.opacity = ratio > 0.05 ? 0 : 1;
}

/* ============ STREAK BANNER ============ */
function renderStreakBanner() {
  const banner = document.getElementById('streak-banner');
  const st = nofapStreak();
  if (st > 0) {
    banner.textContent = `NOFAP STREAK: DAY ${st}`;
  } else {
    banner.textContent = '';
  }
}

/* ============ BOOT ============ */
(async function boot() {
  HERO.init();
  await loadState();
  applyTheme();
  await handleUrlImport(); // iOS Shortcuts: ?steps= / ?prayer=
  document.getElementById('date-display').textContent = formatLong(new Date());
  renderGrid();
  renderInsanometer();
  renderStreakBanner();
  // initial sync pull (adopt remote if newer)
  if (S.settings && S.settings.sync && S.settings.sync.enabled) {
    SyncEngine.sync(true).catch(() => {});
    // periodic background sync every 2 min
    setInterval(() => { SyncEngine.sync(true).catch(() => {}); }, 120000);
  }
  document.getElementById('detail-back').addEventListener('click', closeDetail);
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('settings').classList.contains('open')) closeSettings();
      else closeDetail();
    }
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  // close settings on outside click
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('settings');
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || e.target.closest('#settings-btn')) return;
    closeSettings();
  });
  // refresh insanometer every minute (deadlines pass over time)
  setInterval(() => { renderInsanometer(); }, 60000);
  // roll over if midnight crosses while app is open
  setInterval(async () => {
    if (S && S.today !== todayKey()) {
      await rolloverDay();
      renderGrid(); renderInsanometer(); renderStreakBanner();
      if (S.settings && S.settings.autoPrayerTimes) fetchPrayerTimes(true);
    }
  }, 30000);
  // fetch prayer times if needed
  if (S.settings && S.settings.autoPrayerTimes) {
    if (!S.prayerCache || S.prayerCache.date !== todayKey()) fetchPrayerTimes(true);
    else if (S.prayerCache.timings) applyPrayerTimings(S.prayerCache.timings);
  }
  // audio
  if (S.settings && S.settings.audio) {
    // wait for first user gesture
    const startOnce = () => { AudioEngine.start(); document.removeEventListener('click', startOnce); document.removeEventListener('keydown', startOnce); };
    document.addEventListener('click', startOnce);
    document.addEventListener('keydown', startOnce);
  }
  // screensaver
  Screensaver.arm();
})();
</script>
