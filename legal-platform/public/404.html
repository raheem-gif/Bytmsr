<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الصفحة غير موجودة — {{site_name}}</title>
    <meta name="description" content="الصفحة المطلوبة غير موجودة لدى {{brand_name}}. تابع طلبك أو قدّم طلبًا جديدًا أو تواصل معنا." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--site:head-->
    <!--site:critical-css:legal-->
    <script type="module" src="/assets/js/public/landing.js"></script>
  </head>
  <body class="site pub v91" data-side="{{side}}">
    <a class="skip-link" href="#main">انتقال إلى المحتوى</a>
    {{{header}}}

    <main id="main" tabindex="-1">
      <section class="pub-page-hero" aria-labelledby="page-title">
        <div class="pub-container">
          <nav aria-label="مسار التصفح">
            <ol class="pub-crumbs">
              <li><a href="/">الرئيسية</a></li>
              <li aria-current="page">صفحة غير موجودة</li>
            </ol>
          </nav>
          <!-- v11 gate-public (G11-52): النصوص والروابط حسب جانب الزائر («خيري» = نص 10.0 حرفيًا) -->
          <h1 id="page-title">{{nf_h1}}</h1>
          <p>{{nf_text}}</p>
        </div>
      </section>

      <!-- B91-11: صفحة تُفتح غالبًا لأول مرة من رابط واتساب مقطوع: العنوان من الأنماط المضمّنة، والملف الكامل هنا -->
      <link rel="stylesheet" href="/assets/css/public-site.css" />
      <section class="pub-section" aria-labelledby="next-title">
        <div class="pub-container">
          <article class="pub-doc">
            <h2 id="next-title">{{nf_h2}}</h2>
            <div class="pub-cta-row">
              <a class="pub-btn pub-btn-teal pub-btn-primary" href="/portal">{{nf_follow}}</a>
              <a class="pub-btn pub-btn-outline" href="{{nf_new_href}}" data-cta="intake">{{nf_new}}</a>
              <a class="pub-btn pub-btn-outline" href="{{nf_home_href}}">الصفحة الرئيسية</a>
            </div>
            <!--#if org_phone-->
            <p style="margin-block-start: 16px">{{nf_call}} <a href="tel:{{org_phone_href}}" dir="ltr" class="pub-ltr">{{org_phone}}</a><!--#if office_hours_line--> — {{office_hours_line}}<!--/if office_hours_line--></p>
            <!--/if org_phone-->
          </article>
        </div>
      </section>
    </main>

    {{{footer}}}
  </body>
</html>
