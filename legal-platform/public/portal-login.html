<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>متابعة طلبك — {{brand_name}}</title>
    <meta name="description" content="ارجعي لصفحة طلبك عند {{brand_name}}: افتحيها من الموبايل ده، أو كلمينا وهنبعتلك الرابط." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--site:head-->
    <link rel="preload" href="/assets/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/public-site.css" />
    <link rel="stylesheet" href="/assets/css/v91-portal.css" />
    <script type="module" src="/assets/js/public/portal-login.js"></script>
  </head>
  <body class="site pub v91 bp-login" data-side="{{side}}">
    <a class="skip-link" href="#main">انتقال إلى المحتوى</a>
    {{{header}}}

    <main id="main" tabindex="-1">
      <div class="bp-page">
        <h1 id="page-title" class="bp-login-title">تابعي طلبك</h1>
        <div id="portal-login-root" aria-live="polite">
          <p class="bp-sr" role="status">بنجهّز الصفحة…</p>
        </div>
        <noscript><p>الصفحة دي محتاجة تشغيل JavaScript. ممكن تكلمنا على طول وهنبعتلك رابط صفحتك:</p>{{{contact_list}}}</noscript>
      </div>
    </main>

    {{{footer}}}
  </body>
</html>
