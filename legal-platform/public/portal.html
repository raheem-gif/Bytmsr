<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>متابعة طلبك — {{org_name}}</title>
    <meta name="description" content="صفحتك الخاصة لمتابعة طلبك لدى {{org_name}}: المطلوب منك، وصل طلبك لفين، الرد، المواعيد، والرسائل." />
    <!-- صفحة خاصة برابط سري: لا تُفهرس، ولا يُرسل رابطها في Referer عند فتح أي رابط منها -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--site:head-->
    <link rel="preload" href="/assets/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/public-site.css" />
    <!-- (إصلاح 9.1) v91-b-forms.css يُحمَّل مع الكاميرا والتسجيل أول مرة تُفتح صفحة فيها إرسال (portal.js) -->
    <link rel="stylesheet" href="/assets/css/v91-portal.css" />
    <script type="module" src="/assets/js/public/portal.js"></script>
  </head>
  <body class="site pub v91 bp-portal">
    <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
    {{{header}}}

    <main id="main" class="site-main bp-main" tabindex="-1">
      <div id="portal-root">
        <div class="bp-page bp-skeleton" aria-busy="true">
          <p class="bp-sr" role="status">بنجهّز صفحتك…</p>
          <div class="bp-sk bp-sk-h1"></div>
          <div class="bp-sk bp-sk-line"></div>
          <div class="bp-sk bp-sk-card"></div>
          <div class="bp-sk bp-sk-card is-short"></div>
        </div>
      </div>
      <noscript>
        <div class="bp-page">
          <p class="bp-noscript">الصفحة دي محتاجة تشغيل JavaScript في المتصفح. ممكن تكلمنا على طول:</p>
          {{{contact_list}}}
        </div>
      </noscript>
    </main>

    {{{footer}}}
  </body>
</html>
